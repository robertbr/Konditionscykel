<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymstick Deep Scan</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1a1a1a;
            --text-main: #00ff00;
            --border-color: #333;
        }

        body { 
            font-family: 'Courier New', monospace; 
            background: var(--bg-color); 
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard { 
            background: var(--card-bg); 
            border: 1px solid var(--text-main);
            padding: 20px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        .header-row { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px;}
        .big-val { font-size: 2rem; font-weight: bold; }
        .label { font-size: 0.8rem; opacity: 0.7; }

        button { 
            background: #004400; 
            color: #00ff00; 
            border: 1px solid #00ff00; 
            padding: 15px; 
            width: 100%; 
            font-family: inherit; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
        }
        button:hover { background: #006600; }
        button:disabled { border-color: #555; color: #555; background: #111; cursor: not-allowed; }

        /* LOGG FÖNSTER */
        .log-window {
            width: 100%;
            max-width: 800px;
            height: 400px;
            background: #111;
            border: 1px solid #555;
            overflow-y: scroll;
            font-size: 11px;
            padding: 10px;
            white-space: pre-wrap;
            margin-top: 20px;
            color: #ccc;
        }
        
        .log-data { color: #00ffff; font-weight: bold; }
        .log-info { color: #888; }
        .log-err { color: #ff5555; }

        .action-row { display: flex; gap: 10px; width: 100%; max-width: 800px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header-row">
        <div>Gymstick / iConsole Deep Scan</div>
        <div id="status">Väntar...</div>
    </div>
    
    <div style="margin-bottom:20px; color:#aaa; font-size:0.9rem;">
        Detta verktyg letar efter ALLA datakanaler. Trampa hela tiden medan scanningen pågår.
    </div>

    <button id="connectBtn">STARTA DJUPSCANNING</button>
</div>

<div class="action-row">
    <button id="dlLogBtn">SPARA LOGG-FIL</button>
    <button id="resetBtn" style="background:#330000; border-color:red; color:red">LADDA OM</button>
</div>

<div class="log-window" id="logOutput">Klicka på knappen för att starta...</div>

<script>
    const connectBtn = document.getElementById('connectBtn');
    const dlLogBtn = document.getElementById('dlLogBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusEl = document.getElementById('status');
    const logOut = document.getElementById('logOutput');

    let fullLog = []; 

    function log(msg, type = 'info') {
        const time = new Date().toLocaleTimeString();
        const line = `[${time}] ${msg}`;
        fullLog.push(line);
        
        const span = document.createElement('div');
        span.textContent = line;
        if(type === 'data') span.className = 'log-data';
        if(type === 'err') span.className = 'log-err';
        if(type === 'info') span.className = 'log-info';
        
        logOut.appendChild(span);
        logOut.scrollTop = logOut.scrollHeight;
        console.log(line);
    }

    resetBtn.addEventListener('click', () => location.reload());

    dlLogBtn.addEventListener('click', () => {
        const blob = new Blob([fullLog.join('\n')], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "gymstick_deep_scan.txt";
        a.click();
    });

    connectBtn.addEventListener('click', async () => {
        try {
            statusEl.textContent = "Söker...";
            log("--- STARTAR DJUPSCANNING ---");
            
            // VIKTIGT: acceptAllDevices: true låter oss se ALLT, 
            // men vi måste inkludera optionalServices för att få tillgång till dem.
            // Vi listar vanliga iConsole UUIDs här.
            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [
                    'fitness_machine', 'cycling_power', 'cycling_speed_and_cadence', 'heart_rate', 'device_information',
                    // iConsole / Proprietary UUIDs (ofta FFF0 eller liknande)
                    '0000fff0-0000-1000-8000-00805f9b34fb',
                    '0000fe95-0000-1000-8000-00805f9b34fb' 
                ]
            });

            device.addEventListener('gattserverdisconnected', () => {
                log("!!! FRÅNKOPPLAD !!!", 'err');
                statusEl.textContent = "Frånkopplad";
                connectBtn.disabled = false;
            });

            log(`Vald enhet: ${device.name} (ID: ${device.id})`);
            
            const server = await device.gatt.connect();
            log("GATT Ansluten! Hämtar tjänster...");

            const services = await server.getPrimaryServices();
            log(`Hittade ${services.length} tjänster.`);

            // Loopa igenom ALLA tjänster
            for (const service of services) {
                log(`SERVICE: ${service.uuid}`, 'info');
                
                try {
                    const characteristics = await service.getCharacteristics();
                    
                    for (const char of characteristics) {
                        const props = [];
                        if (char.properties.read) props.push("READ");
                        if (char.properties.write) props.push("WRITE");
                        if (char.properties.notify) props.push("NOTIFY");
                        if (char.properties.indicate) props.push("INDICATE");
                        
                        log(`  -> CHAR: ${char.uuid} [${props.join(', ')}]`, 'info');

                        // Om den går att lyssna på, starta lyssning!
                        if (char.properties.notify || char.properties.indicate) {
                            try {
                                await char.startNotifications();
                                char.addEventListener('characteristicvaluechanged', (e) => handleData(e, char.uuid));
                                log(`     Lyckades starta notifikationer på ${char.uuid}`, 'data');
                            } catch (err) {
                                log(`     Kunde inte starta notifikationer: ${err}`, 'err');
                            }
                        }
                    }
                } catch (err) {
                    log(`  Kunde inte hämta characteristics: ${err}`, 'err');
                }
            }

            // Försök starta standard FTMS session om vi hittade kontrollpunkten
            log("--- FÖRSÖKER STARTA SESSION (FTMS) ---");
            startSessionAttempt(server);

        } catch (err) {
            log("CRITICAL ERROR: " + err, 'err');
            statusEl.textContent = "Fel!";
        }
    });

    async function startSessionAttempt(server) {
        try {
            // Försök hitta FTMS Control Point
            const service = await server.getPrimaryService('fitness_machine');
            const cp = await service.getCharacteristic('00002ad9-0000-1000-8000-00805f9b34fb');
            
            log("Skickar Reset (0x01) till FTMS CP...");
            await cp.writeValue(new Uint8Array([0x01]));
            
            setTimeout(async () => {
                 log("Skickar Start (0x07) till FTMS CP...");
                 await cp.writeValue(new Uint8Array([0x07]));
            }, 1000);

        } catch (e) {
            log("Ingen standard FTMS Control Point tillgänglig eller skrivfel.", 'info');
        }
    }

    function handleData(event, uuid) {
        const value = event.target.value;
        const raw = new Uint8Array(value.buffer);
        
        // SKAPA HEX-STRÄNG
        let hex = [];
        for(let b of raw) hex.push(b.toString(16).padStart(2,'0').toUpperCase());
        const hexStr = hex.join(" ");
        
        // Visa UUID kort (sista 4 tecknen)
        const shortId = uuid.split('-')[0].substr(4); 
        
        log(`DATA [${shortId}...]: ${hexStr}`, 'data');
    }

</script>

</body>
</html>
