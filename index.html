<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymstick Explorer v12</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --border-color: #30363d;
            --accent: #58a6ff;
            --accent-green: #238636;
            --accent-red: #da3633;
        }

        body { 
            font-family: 'Segoe UI', monospace; 
            background: var(--bg-color); 
            color: var(--text-main);
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
        }

        .dashboard { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        /* DATA GRID */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .data-box {
            background: #0d1117;
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
            border-radius: 4px;
        }
        .data-val { font-size: 1.5rem; font-weight: bold; color: var(--text-main); }
        .data-lbl { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }

        /* COMMAND SECTION */
        .cmd-section {
            background: #21262d;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        
        button { 
            background: var(--accent-green); 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 4px;
            font-weight: bold; 
            cursor: pointer; 
            font-size: 0.9rem;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }

        #connectBtn { font-size: 1.1rem; padding: 15px; margin-bottom: 20px; background: var(--accent); margin-top: 0;}

        /* LOG */
        .log-window {
            width: 100%;
            max-width: 600px;
            height: 300px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            overflow-y: scroll;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
        
        .l-data { color: #58a6ff; font-weight: bold; }
        .l-err { color: #f85149; }
        .l-succ { color: #3fb950; }
        .l-info { color: #8b949e; }

    </style>
</head>
<body>

<div class="dashboard">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid var(--border-color); padding-bottom:5px;">
        <strong>Gymstick Explorer v12</strong>
        <span id="status">Ej ansluten</span>
    </div>

    <button id="connectBtn">ANSLUT TILL CYKEL</button>

    <!-- Realtidsdata -->
    <div class="data-grid">
        <div class="data-box">
            <div class="data-lbl">Hastighet</div>
            <div class="data-val" id="valSpeed">0.0</div>
        </div>
        <div class="data-box">
            <div class="data-lbl">Effekt</div>
            <div class="data-val" id="valWatt">0</div>
        </div>
        <div class="data-box">
            <div class="data-lbl">Tid (Min:Sek)</div>
            <div class="data-val" id="valTime">00:00</div>
        </div>
        <div class="data-box">
            <div class="data-lbl">Nivå</div>
            <div class="data-val" id="valLevel">--</div>
        </div>
    </div>

    <!-- Kommando Sändare -->
    <div class="cmd-section">
        <div class="data-lbl" style="margin-bottom:10px;">iConsole Kommandon</div>
        <button id="btnStartComplex" disabled>Skicka iConsole START-paket (F0 A5...)</button>
        <button id="btnPing" disabled style="background:#8b949e">Skicka Ping (F0)</button>
    </div>
</div>

<div style="width:100%; max-width:600px; display:flex; gap:10px; margin-bottom:5px;">
    <button id="dlLogBtn" style="background:#21262d; flex:1; margin-top:0;">Spara Logg</button>
    <button id="clearLogBtn" style="background:#21262d; flex:1; margin-top:0;">Rensa</button>
</div>

<div class="log-window" id="logOutput">Klicka på ANSLUT för att börja...</div>

<script>
    // --- UI ---
    const ui = {
        status: document.getElementById('status'),
        log: document.getElementById('logOutput'),
        speed: document.getElementById('valSpeed'),
        watt: document.getElementById('valWatt'),
        time: document.getElementById('valTime'),
        level: document.getElementById('valLevel'),
        btnStartComplex: document.getElementById('btnStartComplex'),
        btnPing: document.getElementById('btnPing')
    };

    let fullLog = [];
    let iconsoleWriteChar = null; // FFF2

    // --- LOGGNING ---
    function log(msg, type = 'info') {
        const time = new Date().toLocaleTimeString().split(' ')[0];
        const line = `[${time}] ${msg}`;
        fullLog.push(line);
        
        const div = document.createElement('div');
        div.textContent = line;
        div.className = 'l-' + type;
        ui.log.appendChild(div);
        ui.log.scrollTop = ui.log.scrollHeight;
    }

    document.getElementById('clearLogBtn').onclick = () => { ui.log.innerHTML = ''; fullLog = []; };
    document.getElementById('dlLogBtn').onclick = () => {
        const blob = new Blob([fullLog.join('\n')], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "gymstick_v12_log.txt";
        a.click();
    };

    // --- ANSLUTNING ---
    document.getElementById('connectBtn').onclick = async () => {
        try {
            ui.status.textContent = "Söker...";
            log("Startar sökning...", 'info');

            const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['fitness_machine'] }],
                optionalServices: [
                    'fitness_machine',
                    '0000fff0-0000-1000-8000-00805f9b34fb' // iConsole
                ]
            });

            device.addEventListener('gattserverdisconnected', () => {
                ui.status.textContent = "Frånkopplad";
                log("Enhet frånkopplad!", 'err');
                document.getElementById('connectBtn').disabled = false;
                disableButtons();
            });

            log(`Vald: ${device.name}`, 'succ');
            const server = await device.gatt.connect();
            log("GATT Ansluten.", 'succ');
            ui.status.textContent = "Ansluten";
            document.getElementById('connectBtn').disabled = true;

            // 1. SETUP iConsole
            try {
                const service = await server.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
                log("Hittade iConsole (FFF0)", 'info');

                // Lyssna på FFF1
                const notifyChar = await service.getCharacteristic('0000fff1-0000-1000-8000-00805f9b34fb');
                await notifyChar.startNotifications();
                notifyChar.addEventListener('characteristicvaluechanged', (e) => handleData(e, 'ICONSOLE'));
                log("Lyssnar på FFF1", 'succ');

                // Spara skriv-kanal FFF2
                iconsoleWriteChar = await service.getCharacteristic('0000fff2-0000-1000-8000-00805f9b34fb');
                log("Skriv-kanal FFF2 redo.", 'info');
                
                enableButtons();

            } catch (e) {
                log("Kunde inte hitta iConsole: " + e, 'err');
            }

        } catch (err) {
            log("Fel: " + err, 'err');
            ui.status.textContent = "Fel";
        }
    };

    // --- DATA ---
    function handleData(event, type) {
        const data = new Uint8Array(event.target.value.buffer);
        const hex = Array.from(data).map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
        
        log(`RX: ${hex}`, 'data');

        // iConsole Parsing (F2 ...)
        if (data[0] === 0xF2) {
            // Struktur: F2 [Len] [Data...] [CS]
            // Dataoffset börjar på index 2
            // Ofta: 
            // Byte 2-3: Time
            // Byte 4-5: Speed * 10
            // Byte 6-7: RPM
            // Byte 8-9: Dist
            // Byte 10-11: Watt
            
            if (data.length > 5) {
                const speedVal = (data[4] << 8) | data[5];
                ui.speed.textContent = (speedVal / 10).toFixed(1);
            }
            if (data.length > 7) {
                // Gissning: RPM
            }
            if (data.length > 11) {
                const wattVal = (data[10] << 8) | data[11];
                ui.watt.textContent = wattVal;
            }
            
            // Tid (Byte 2-3)
            if (data.length > 3) {
               const timeM = data[2];
               const timeS = data[3];
               ui.time.textContent = `${timeM}:${timeS.toString().padStart(2,'0')}`;
            }
            
            // Level (ofta byte 13 eller 14?)
            if (data.length > 13) {
               ui.level.textContent = data[13];
            }
        }
    }

    function enableButtons() {
        ui.btnStartComplex.disabled = false;
        ui.btnPing.disabled = false;
    }
    
    function disableButtons() {
        ui.btnStartComplex.disabled = true;
        ui.btnPing.disabled = true;
    }

    async function send(bytes) {
        if (!iconsoleWriteChar) return;
        try {
            // Beräkna Checksumma (Sista byten)
            // iConsole checksum är ofta summan av alla bytes & 0xFF
            let sum = 0;
            for(let b of bytes) sum += b;
            const checksum = sum & 0xFF;
            bytes.push(checksum); // Lägg till CS på slutet

            const hex = bytes.map(b => b.toString(16).toUpperCase()).join(' ');
            log(`TX [FFF2]: ${hex}`, 'info');
            await iconsoleWriteChar.writeValue(new Uint8Array(bytes));
        } catch (e) { log("Sändningsfel: " + e, 'err'); }
    }

    // Ping (Bara för test)
    ui.btnPing.onclick = () => send([0xF0]);

    // DET KOMPLEXA START-PAKETET
    // Format: Header(F0) Cmd(A5) Time(1,2) Dist(3,4) Cal(5,6) Pulse(7,8) Level(9)
    // Vi sätter: Tid=20min, Dist=0, Cal=0, Puls=0, Level=1
    ui.btnStartComplex.onclick = () => {
        const packet = [
            0xF0, // Header
            0xA5, // CMD: Start
            0x00, 0x14, // Time: 20 minuter (00 14)
            0x00, 0x00, // Distance: 0
            0x00, 0x00, // Calories: 0
            0x00, 0x00, // Pulse limit: 0
            0x01  // Level: 1
        ];
        send(packet);
    };

</script>

</body>
</html>
