<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymstick Pro Monitor</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --border-color: #0f3460;
            --text-main: #fff;
            --text-dim: #8d99ae;
            --accent-primary: #e94560;
            --accent-secondary: #4cc9f0;
            --accent-speed: #23d5ab;
            --accent-cadence: #7209b7;
            --accent-watt: #f72585;
            --accent-cal: #fca311;
            --accent-res: #ffd166;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main);
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        .dashboard { 
            background: var(--card-bg); 
            border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            width: 100%;
            max-width: 450px;
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        /* --- HEADER (Tid | Motstånd | Puls) --- */
        .header-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .top-stat { display: flex; flex-direction: column; }
        .top-stat.left { text-align: left; }
        .top-stat.center { text-align: center; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); }
        .top-stat.right { text-align: right; }

        .label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; font-weight: 600;}
        .value-small { font-size: 1.6rem; font-weight: 700; color: var(--accent-primary); }
        .value-res { font-size: 1.8rem; font-weight: 800; color: var(--accent-res); line-height: 1; }
        .value-time { font-size: 1.6rem; font-weight: 700; color: var(--text-main); font-variant-numeric: tabular-nums; }

        /* --- HUVUDVÄRDE (Watt) --- */
        .main-stat { text-align: center; margin: 30px 0; }
        .main-val { font-size: 5.5rem; line-height: 0.9; font-weight: 800; color: var(--accent-watt); text-shadow: 0 0 20px rgba(247, 37, 133, 0.3); }
        .main-unit { font-size: 1.2rem; color: var(--accent-watt); opacity: 0.8; font-weight: 700; letter-spacing: 2px; margin-top: 5px; display: block; }

        /* --- RUTNÄT --- */
        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: rgba(15, 52, 96, 0.5);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }
        
        .stat-val { font-size: 2rem; font-weight: 700; line-height: 1.1; }
        .stat-unit { font-size: 0.8rem; color: var(--text-dim); margin-top: 2px; font-weight: 600;}

        /* --- KNAPPAR --- */
        .controls { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        
        button { 
            background: var(--accent-secondary); 
            color: #000; 
            border: none; 
            padding: 14px 30px; 
            border-radius: 50px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-weight: 800;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(76, 201, 240, 0.3);
            transition: all 0.2s; 
            width: 100%;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(76, 201, 240, 0.5); }
        button:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .btn-secondary { background: transparent; border: 2px solid var(--border-color); color: var(--text-dim); box-shadow: none; }
        .btn-secondary:hover { background: var(--border-color); color: #fff; transform: translateY(-1px); }
        
        /* --- STATUS & LOADING --- */
        .progress-container {
            width: 100%;
            background: #0f182b;
            height: 6px;
            border-radius: 3px;
            margin-top: 15px;
            margin-bottom: 5px;
            position: relative;
            display: none;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent-res);
            width: 0%;
            transition: width 0.3s ease-out;
        }
        .status-text { font-size: 0.8rem; color: var(--text-dim); min-height: 20px; text-align: center; margin-bottom: 10px; }

        /* --- FÄRGER --- */
        .text-watt { color: var(--accent-watt); }
        .text-dist { color: var(--accent-secondary); }
        .text-cal { color: var(--accent-cal); }
        .text-cad { color: var(--accent-cadence); }
        .text-speed { color: var(--accent-speed); }
        .text-res { color: var(--accent-res); }

        /* --- ANALYS DELEN --- */
        .analysis-section {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            padding: 25px;
            display: none; 
            margin-top: 20px;
        }
        .analysis-section.visible { display: block; }

        .analysis-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        select { background: var(--bg-color); color: white; border: 1px solid var(--border-color); padding: 8px; border-radius: 8px; }

        .totals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .total-card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; font-size: 0.9rem; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .total-card b { display: block; font-size: 1.4rem; margin-bottom: 4px; color: #fff; }

        /* GRAF */
        .chart-container { 
            width: 100%; height: 300px; 
            background: rgba(0,0,0,0.2); 
            border-radius: 15px; 
            position: relative; 
            margin-bottom: 25px; 
            padding: 10px; 
            box-sizing: border-box; 
            border: 1px solid var(--border-color);
        }
        svg { width: 100%; height: 100%; }
        polyline { fill: none; stroke-width: 3; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }

        /* TABELL */
        .table-wrapper { overflow-x: auto; max-height: 400px; border-radius: 10px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: right; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); }
        th { text-align: right; color: var(--text-dim); background: #121a2e; position: sticky; top: 0; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;}
        th:first-child, td:first-child { text-align: left; }
        tr:last-child td { border-bottom: none; }

        .action-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 25px; }
        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; flex: 1; }
        .file-input-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }

    </style>
</head>
<body>

<!-- HUVUDPANEL -->
<div class="dashboard">
    <!-- Header -->
    <div class="header-row">
        <div class="top-stat left">
            <span class="label">Tid</span>
            <span class="value-time" id="time">00:00</span>
        </div>
        <div class="top-stat center">
            <span class="label">Motstånd</span>
            <span class="value-res" id="resistance">--</span>
        </div>
        <div class="top-stat right">
            <span class="label">Puls</span>
            <div>
                <span class="value-small" id="hr">--</span> 
                <span class="stat-unit">bpm</span>
            </div>
        </div>
    </div>

    <!-- Main -->
    <div class="main-stat">
        <div class="label">EFFEKT</div>
        <div class="main-val" id="power">0</div>
        <span class="main-unit">WATT</span>
    </div>

    <!-- Grid -->
    <div class="grid-stats">
        <div class="stat-box">
            <div class="label">Hastighet</div>
            <div class="stat-val text-speed" id="speed">0.0</div>
            <div class="stat-unit">km/h</div>
        </div>
        <div class="stat-box">
            <div class="label">Sträcka</div>
            <div class="stat-val text-dist" id="distance">0.00</div>
            <div class="stat-unit">km</div>
        </div>
        <div class="stat-box">
            <div class="label">Kadens</div>
            <div class="stat-val text-cad" id="cadence">0</div>
            <div class="stat-unit">rpm</div>
        </div>
        <div class="stat-box">
            <div class="label">Kalorier</div>
            <div class="stat-val text-cal" id="calories">0</div>
            <div class="stat-unit">kcal</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="progress-container" id="progContainer">
        <div class="progress-bar" id="progBar"></div>
    </div>
    <div class="status-text" id="status">Klar att ansluta...</div>

    <div class="controls">
        <button id="connectBtn">ANSLUT CYKEL</button>
        <button id="toggleAnalysisBtn" class="btn-secondary">VISA HISTORIK & DATA</button>
    </div>
</div>

<!-- ANALYS & HISTORIK -->
<div class="analysis-section" id="analysisSection">
    <div class="analysis-header">
        <span style="font-size:1.2rem; font-weight:bold;">Din Träningshistorik</span>
        <select id="resolutionSelect">
            <option value="10">Upplösning: 10s</option>
            <option value="30">Upplösning: 30s</option>
            <option value="60" selected>Upplösning: 1 min</option>
            <option value="300">Upplösning: 5 min</option>
        </select>
    </div>

    <div class="totals-grid">
        <div class="total-card text-dist">Total Sträcka<br><b id="lifeDistance">0.0 km</b></div>
        <div class="total-card text-res">Antal Pass<br><b id="sessionCount">0</b></div>
        <div class="total-card text-watt">Snitt (Detta Pass)<br><b id="avgWatt">0 W</b></div>
    </div>

    <div class="chart-container">
        <div style="position:absolute; top:10px; left:15px; font-size:11px; color:#aaa; font-weight:600;">
            <span style="color:var(--accent-watt)">― Watt</span> &nbsp;&nbsp; 
            <span style="color:var(--accent-primary)">-- Puls</span>
        </div>
        <svg id="chartSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    </div>

    <div class="table-wrapper">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Tid</th>
                    <th>Watt</th>
                    <th>Km/h</th>
                    <th>Puls</th>
                    <th>RPM</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="action-btns">
        <button class="btn-secondary" id="endSessionBtn" style="flex:1">Spara Pass</button>
        <button class="btn-secondary" id="exportJsonBtn" style="flex:1">Exportera JSON</button>
        
        <div class="file-input-wrapper btn-secondary" style="flex:1">
            <button class="btn-secondary" style="width:100%; pointer-events:none; border:none;">Importera</button>
            <input type="file" id="importJsonInput" accept=".json">
        </div>
        
        <button class="btn-secondary" onclick="if(confirm('Rensa all historik?')){localStorage.clear();location.reload();}" style="flex:0 0 auto; color:#ff6b6b; border-color:#ff6b6b;">X</button>
    </div>
</div>

<script>
    // --- UI REFERENSER ---
    const ui = {
        connectBtn: document.getElementById('connectBtn'),
        status: document.getElementById('status'),
        progContainer: document.getElementById('progContainer'),
        progBar: document.getElementById('progBar'),
        analysisSection: document.getElementById('analysisSection'),
        toggleAnalysisBtn: document.getElementById('toggleAnalysisBtn'),
        // Datafält
        speed: document.getElementById('speed'),
        watt: document.getElementById('power'),
        cadence: document.getElementById('cadence'),
        hr: document.getElementById('hr'),
        time: document.getElementById('time'),
        dist: document.getElementById('distance'),
        cal: document.getElementById('calories'),
        res: document.getElementById('resistance'),
        // Analys
        lifeDist: document.getElementById('lifeDistance'),
        sessCount: document.getElementById('sessionCount'),
        avgWatt: document.getElementById('avgWatt'),
        table: document.getElementById('dataTable').querySelector('tbody'),
        chart: document.getElementById('chartSvg'),
        resSelect: document.getElementById('resolutionSelect')
    };

    // --- VARIABLER ---
    let iconsoleWrite = null; 
    let pollInterval = null;
    let startTime = null; // För vår interna logg
    let sessionData = []; // Nuvarande passdata
    
    // Protokollsekvens (Facit från din logg)
    const SEQ = [
        { name: "Ping",   bytes: [0xF0, 0xA0, 0x01, 0x01, 0x92], expect: 0xB0 },
        { name: "Mode",   bytes: [0xF0, 0xA3, 0x01, 0x01, 0x01, 0x96], expect: 0xB3 },
        { name: "Config", bytes: [0xF0, 0xA4, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0xA0], expect: 0xB4 },
        { name: "Start",  bytes: [0xF0, 0xA5, 0x01, 0x01, 0x02, 0x99], expect: 0xB5 }
    ];
    let seqIndex = 0;
    const READ_CMD = [0xF0, 0xA2, 0x01, 0x01, 0x94];

    // Ladda historik
    let history = JSON.parse(localStorage.getItem('gymstick_history_v1')) || {
        totalDist: 0,
        sessions: []
    };
    updateGlobalStats();

    // --- ANSLUTNING & SEKVENS ---
    ui.connectBtn.onclick = async () => {
        try {
            ui.status.textContent = "Söker...";
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['fitness_machine'] }],
                optionalServices: ['0000fff0-0000-1000-8000-00805f9b34fb']
            });

            device.addEventListener('gattserverdisconnected', onDisconnect);
            ui.status.textContent = "Ansluter...";
            
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
            
            // Setup Lyssning
            const notifyChar = await service.getCharacteristic('0000fff1-0000-1000-8000-00805f9b34fb');
            await notifyChar.startNotifications();
            notifyChar.addEventListener('characteristicvaluechanged', handleData);
            
            // Setup Skrivning
            iconsoleWrite = await service.getCharacteristic('0000fff2-0000-1000-8000-00805f9b34fb');
            
            // Starta Handskakning
            ui.connectBtn.disabled = true;
            ui.connectBtn.textContent = "KONFIGURERAR...";
            ui.progContainer.style.display = 'block';
            startSequence();

        } catch (e) {
            console.error(e);
            ui.status.textContent = "Fel: " + e.message;
        }
    };

    function startSequence() {
        seqIndex = 0;
        sendNextStep();
    }

    async function sendNextStep() {
        if (seqIndex >= SEQ.length) {
            // Klar!
            ui.status.textContent = "KÖR! (Läser data...)";
            ui.connectBtn.textContent = "ANSLUTEN";
            ui.connectBtn.style.background = "#28a745";
            ui.connectBtn.style.color = "#fff";
            ui.progBar.style.width = "100%";
            setTimeout(() => { ui.progContainer.style.display = 'none'; }, 1000);
            
            // Starta loop
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => send(READ_CMD), 1000);
            
            // Ny session
            sessionData = [];
            startTime = Date.now();
            return;
        }

        const step = SEQ[seqIndex];
        const pct = ((seqIndex) / SEQ.length) * 100;
        ui.progBar.style.width = pct + "%";
        ui.status.textContent = `Initierar: ${step.name}...`;
        
        await send(step.bytes);
        // Vi väntar på svar i handleData innan vi går vidare
    }

    async function send(bytes) {
        if (!iconsoleWrite) return;
        try { await iconsoleWrite.writeValue(new Uint8Array(bytes)); } 
        catch (e) { console.log(e); }
    }

    function onDisconnect() {
        ui.status.textContent = "Frånkopplad";
        ui.connectBtn.disabled = false;
        ui.connectBtn.textContent = "ANSLUT CYKEL";
        ui.connectBtn.style.background = ""; 
        if (pollInterval) clearInterval(pollInterval);
        ui.progContainer.style.display = 'none';
        seqIndex = 0;
    }

    // --- DATA HANTERING (The Magic) ---
    function handleData(event) {
        const data = new Uint8Array(event.target.value.buffer);
        
        // 1. Hantera Sekvens-svar (ACK)
        if (seqIndex < SEQ.length) {
            if (data[0] === 0xF0 && data[1] === SEQ[seqIndex].expect) {
                seqIndex++;
                setTimeout(sendNextStep, 300); // Liten paus för säkerhet
                return;
            }
        }

        // 2. Hantera Riktig Data (F0 B2 ...)
        if (data.length >= 20 && data[0] === 0xF0 && data[1] === 0xB2) {
            parseAndDisplay(data);
        }
    }

    function parseAndDisplay(data) {
        // "Minus 1"-formeln
        const val = (h, l) => 100 * (data[h] - 1) + (data[l] - 1);

        const speed = val(6, 7) / 10;
        const rpm = val(8, 9);
        const dist = val(10, 11) / 10;
        const cal = val(12, 13);
        const hr = val(14, 15);
        const watt = val(16, 17) / 10;
        const level = data[18] - 1; // Motståndsnivå!

        // Tid (från cykeln)
        let tMin = data[4] - 1;
        let tSec = data[5] - 1;
        if(tMin < 0) tMin = 0; if(tSec < 0) tSec = 0;

        // Uppdatera UI
        ui.speed.textContent = speed.toFixed(1);
        ui.watt.textContent = watt.toFixed(0);
        ui.cadence.textContent = rpm;
        ui.hr.textContent = hr;
        ui.dist.textContent = dist.toFixed(1);
        ui.cal.textContent = cal;
        ui.res.textContent = level;
        ui.time.textContent = `${tMin}:${tSec.toString().padStart(2,'0')}`;

        // Logga för analys
        logPoint(speed, watt, hr, rpm, level);
        
        // Uppdatera total livstid (om distans ökat)
        // Enkel fix: Vi litar på cykelns total för passet och lägger till diff
        // Men för säkerhet, spara bara passet vid avslut.
    }

    // --- ANALYS & HISTORIK LOGIK ---
    function logPoint(speed, watt, hr, rpm, level) {
        if (!startTime) return;
        const elapsed = (Date.now() - startTime) / 1000;
        
        sessionData.push({
            t: elapsed,
            s: speed,
            w: watt,
            h: hr,
            r: rpm,
            l: level
        });

        // Uppdatera snitt i realtid
        const avgW = sessionData.reduce((a,b)=>a+b.w,0) / sessionData.length;
        ui.avgWatt.textContent = Math.round(avgW) + " W";

        if (ui.analysisSection.classList.contains('visible') && Math.floor(elapsed)%5===0) {
            updateCharts();
        }
    }

    function updateCharts() {
        if (sessionData.length < 2) return;
        const res = parseInt(ui.resSelect.value);
        
        // Sampling
        const buckets = [];
        sessionData.forEach(p => {
            const idx = Math.floor(p.t / res);
            if(!buckets[idx]) buckets[idx] = {c:0, w:0, h:0, s:0, r:0, t:idx*res};
            buckets[idx].c++;
            buckets[idx].w += p.w;
            buckets[idx].h += p.h;
            buckets[idx].s += p.s;
            buckets[idx].r += p.r;
        });

        const valid = buckets.filter(b=>b);
        
        // Rita Tabell
        ui.table.innerHTML = valid.slice().reverse().map(b => `
            <tr>
                <td>${formatTime(b.t)}</td>
                <td class="text-watt">${Math.round(b.w/b.c)}</td>
                <td class="text-speed">${(b.s/b.c).toFixed(1)}</td>
                <td>${Math.round(b.h/b.c)}</td>
                <td class="text-cad">${Math.round(b.r/b.c)}</td>
            </tr>
        `).join('');

        // Rita Graf
        const maxW = Math.max(...valid.map(b=>b.w/b.c)) || 100;
        const maxH = Math.max(...valid.map(b=>b.h/b.c)) || 100;
        let pW="", pH="";
        valid.forEach((b, i) => {
            const x = (i / (valid.length-1)) * 100;
            pW += `${x},${100 - ((b.w/b.c)/ (maxW*1.2) * 100)} `;
            pH += `${x},${100 - ((b.h/b.c)/ (maxH*1.2) * 100)} `;
        });
        ui.chart.innerHTML = `
            <polyline points="${pW}" stroke="#f72585" />
            <polyline points="${pH}" stroke="#e94560" stroke-dasharray="4" opacity="0.7"/>
        `;
    }

    // --- KNAPPAR ---
    ui.toggleAnalysisBtn.onclick = () => {
        ui.analysisSection.classList.toggle('visible');
        updateCharts();
    };
    
    ui.resSelect.onchange = updateCharts;

    document.getElementById('endSessionBtn').onclick = () => {
        if(sessionData.length === 0) return alert("Ingen data att spara.");
        if(!confirm("Avsluta och spara passet?")) return;
        
        const dist = parseFloat(ui.dist.textContent);
        const avgW = parseInt(ui.avgWatt.textContent);
        
        history.sessions.push({
            date: new Date().toISOString(),
            dist: dist,
            avgWatt: avgW,
            duration: sessionData[sessionData.length-1].t,
            data: sessionData
        });
        history.totalDist += dist;
        
        localStorage.setItem('gymstick_history_v1', JSON.stringify(history));
        updateGlobalStats();
        alert("Pass sparat!");
        
        // Reset
        sessionData = [];
        startTime = Date.now();
    };

    function updateGlobalStats() {
        ui.lifeDist.textContent = history.totalDist.toFixed(1) + " km";
        ui.sessCount.textContent = history.sessions.length;
    }

    document.getElementById('exportJsonBtn').onclick = () => {
        const a = document.createElement('a');
        a.href = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(history));
        a.download = 'gymstick_history.json';
        a.click();
    };

    document.getElementById('importJsonInput').onchange = (e) => {
        const r = new FileReader();
        r.onload = (evt) => {
            try {
                history = JSON.parse(evt.target.result);
                localStorage.setItem('gymstick_history_v1', JSON.stringify(history));
                updateGlobalStats();
                alert("Historik inläst!");
            } catch(x){ alert("Fel filformat"); }
        };
        r.readAsText(e.target.files[0]);
    };

    function formatTime(s) {
        return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;
    }

</script>

</body>
</html>
