<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymstick Pro Monitor v4.0</title>
    <style>
        :root {
            /* Mörkblått tema */
            --bg-color: #151525;
            --panel-bg: #1e1e2f;
            --border-color: #2d2d44;
            --text-main: #e0e0e0;
            --text-dim: #888;
            
            /* Färger */
            --c-speed: #00e676;
            --c-watt: #f50057;
            --c-cad: #d500f9;
            --c-hr: #ff3d00;
            --c-dist: #2979ff;
            --c-cal: #ff9100;
            --c-res: #ffd600;
        }

        html { font-size: 14px; }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main);
            margin: 0; 
            padding: 15px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- LAYOUT --- */
        .main-container {
            display: grid;
            gap: 20px;
            flex: 1;
            overflow: hidden;
            /* Vänster panel breddad till 400px (Punkt 2) */
            grid-template-columns: 400px 1fr;
            grid-template-rows: 1fr;
        }

        @media (max-width: 1000px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                overflow-y: auto;
            }
            body { overflow-y: auto; height: auto; }
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        /* --- VÄNSTER PANEL (LIVE) --- */
        .header-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            align-items: center;
        }
        .h-item h3 { margin: 0; font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        
        /* Punkt 1: Större typsnitt för Header-värden */
        .val-big { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
        
        .res-ctrl { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-round {
            width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border-color);
            background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; display:grid; place-items:center; font-size: 1.4rem; line-height: 1;
            transition: 0.2s;
        }
        .btn-round:hover { background: #333; border-color: #555; }

        .watt-display { text-align: center; margin: 10px 0; }
        .watt-num { font-size: 5.5rem; font-weight: 800; line-height: 0.9; color: var(--c-watt); text-shadow: 0 0 30px rgba(245, 0, 87, 0.2); }
        .watt-lbl { font-size: 1.2rem; font-weight: 700; color: var(--c-watt); opacity: 0.8; letter-spacing: 3px; }

        .live-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .live-card { 
            background: rgba(20, 20, 35, 0.6); 
            padding: 12px; border-radius: 12px; 
            text-align: center; 
            display: flex; flex-direction: column; justify-content: center; 
            border: 1px solid var(--border-color);
        }
        .live-lbl { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 2px; font-weight: 600; }
        .live-val { font-size: 2.2rem; font-weight: 700; line-height: 1; }

        .btn-action {
            background: var(--c-dist); color: #fff; border: none; padding: 16px; border-radius: 8px;
            font-weight: 700; cursor: pointer; width: 100%; text-transform: uppercase; font-size: 1rem;
            margin-top: auto; box-shadow: 0 4px 15px rgba(41, 121, 255, 0.3);
            transition: transform 0.1s;
        }
        .btn-action:hover { transform: translateY(-1px); filter: brightness(1.1); }
        .btn-stop { background: var(--c-watt); box-shadow: 0 4px 15px rgba(245, 0, 87, 0.3); display: none; }

        .progress-box { height: 6px; background: #111; margin-top: 15px; border-radius: 3px; overflow: hidden; display: none; }
        .progress-fill { height: 100%; background: var(--c-speed); width: 0%; transition: width 0.3s; }

        /* --- HÖGER PANEL (ANALYS) --- */
        
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .config-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            display: flex; flex-direction: column; gap: 5px;
            transition: all 0.2s;
        }
        .config-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 2px; }
        .config-title { font-weight: bold; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
        .chk { transform: scale(1.2); cursor: pointer; }
        
        .avg-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; min-height: 22px;}
        .avg-val { font-weight: bold; font-family: monospace; font-size: 1rem; }
        select.tiny-select {
            background: #222; color: #aaa; border: 1px solid #444; font-size: 0.75rem; padding: 2px; width: 70px; border-radius: 4px; cursor: pointer;
        }
        
        .single-mode .avg-row:first-child .avg-val { font-size: 2.2rem; line-height: 1; }
        .single-mode .avg-row:first-child { height: auto; margin-top: 8px; }
        .single-mode select.tiny-select { font-size: 0.8rem; width: auto; background: transparent; border: none; }

        /* Grafen (Punkt 3: Mindre font, synliga axlar) */
        .graph-wrapper {
            flex: 1;
            min-height: 350px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            position: relative;
            /* Ökad padding för att axlarna ska rymmas */
            padding: 15px 40px 30px 40px; 
        }
        svg { width: 100%; height: 100%; overflow: visible; }
        
        /* Punkt 3: Mikroskopisk font för SVG-koordinatsystem */
        .axis-text { font-size: 3.5px; font-family: monospace; font-weight: normal; fill: #aaa; }
        .grid-line { stroke: #333; stroke-width: 0.5; stroke-dasharray: 2; }

        .graph-controls { display: flex; justify-content: flex-end; gap: 10px; align-items: center; }
        select.main-select { background: #333; color: #fff; border: 1px solid #555; padding: 6px 12px; border-radius: 6px; }

        .footer-stats { display: flex; justify-content: space-between; color: var(--text-dim); font-size: 0.75rem; margin-top: 5px; border-top: 1px solid var(--border-color); padding-top: 10px;}
        .footer-val { color: var(--text-main); font-weight: bold; }

        .file-controls { display: flex; gap: 10px; margin-top: 10px; }
        .btn-sec { flex: 1; padding: 10px; background: transparent; border: 1px solid var(--border-color); color: var(--text-dim); border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.8rem; text-transform: uppercase; font-weight: 600;}
        .btn-sec:hover { background: var(--border-color); color: #fff; }

        /* --- STATISTIK MODAL --- */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100;
            display: none; justify-content: center; padding: 40px; box-sizing: border-box;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: var(--panel-bg); width: 100%; max-width: 1000px;
            border-radius: 16px; border: 1px solid var(--border-color);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;}
        .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
        
        .stats-filter { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;}
        .stat-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .big-stat-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: center; border: 1px solid var(--border-color); }
        .big-stat-val { font-size: 1.5rem; font-weight: 700; color: #fff; display: block; }
        .big-stat-lbl { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }

        .session-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .session-table th { text-align: left; padding: 10px; border-bottom: 2px solid var(--border-color); cursor: pointer; color: var(--text-dim); text-transform: uppercase; font-size: 0.75rem;}
        .session-table td { padding: 12px 10px; border-bottom: 1px solid var(--border-color); color: #ccc; }
        .session-table tr:hover { background: rgba(255,255,255,0.05); }

        /* Färgklasser */
        .c-watt { color: var(--c-watt); }
        .c-speed { color: var(--c-speed); }
        .c-cad { color: var(--c-cad); }
        .c-hr { color: var(--c-hr); }
        .c-dist { color: var(--c-dist); }
        .c-cal { color: var(--c-cal); }
        .c-res { color: var(--c-res); }

    </style>
</head>
<body>

<div class="main-container">

    <!-- VÄNSTER: LIVE -->
    <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="color:var(--text-dim); letter-spacing:2px;">GYMSTICK GB 8.0</strong>
            <span id="connStatus" style="font-size:0.7rem; color:#555; font-weight:bold;">FRÅNKOPPLAD</span>
        </div>

        <div class="header-grid">
            <div class="h-item">
                <h3>Tid</h3>
                <!-- Punkt 1: Stor font -->
                <div class="val-big" id="valTime">00:00</div>
            </div>
            <div class="h-item">
                <h3>Motstånd</h3>
                <div class="res-ctrl">
                    <button class="btn-round" id="btnResDown">-</button>
                    <!-- Punkt 1: Stor font -->
                    <div class="val-big c-res" id="valRes">--</div>
                    <button class="btn-round" id="btnResUp">+</button>
                </div>
            </div>
            <div class="h-item">
                <h3>Puls</h3>
                <!-- Punkt 1: Stor font -->
                <div class="val-big c-hr" id="valHr">--</div>
            </div>
        </div>

        <div class="watt-display">
            <div class="watt-num" id="valWatt">0</div>
            <div class="watt-lbl">EFFEKT</div>
        </div>

        <div class="live-grid">
            <div class="live-card">
                <div class="live-lbl">Hastighet</div>
                <div class="live-val c-speed" id="valSpeed">0.0</div>
            </div>
            <div class="live-card">
                <div class="live-lbl">Kadens</div>
                <div class="live-val c-cad" id="valCad">0</div>
            </div>
            <div class="live-card">
                <div class="live-lbl">Sträcka</div>
                <div class="live-val c-dist" id="valDist">0.000</div>
            </div>
            <div class="live-card">
                <div class="live-lbl">Kalorier</div>
                <div class="live-val c-cal" id="valCal">0</div>
            </div>
        </div>

        <div style="margin-top:auto">
            <div class="progress-box" id="progBox"><div class="progress-fill" id="progFill"></div></div>
            <div id="statusText" style="text-align:center; font-size:0.75rem; color:var(--text-dim); margin:8px 0;"></div>
            <button class="btn-action" id="connectBtn">ANSLUT CYKEL</button>
            <button class="btn-action btn-stop" id="stopBtn">AVSLUTA</button>
        </div>
    </div>

    <!-- HÖGER: ANALYS -->
    <div class="panel">
        
        <div class="graph-controls">
            <span style="font-size:0.8rem; color:#888;">Upplösning:</span>
            <select id="graphRes" class="main-select">
                <option value="1">1 sek</option>
                <option value="2">2 sek</option>
                <option value="5">5 sek</option>
                <option value="10">10 sek</option>
                <option value="30">30 sek</option>
                <option value="60" selected>1 min</option>
                <option value="300">5 min</option>
            </select>
        </div>

        <div class="config-grid" id="configGrid">
            <!-- Skapas dynamiskt -->
        </div>

        <div class="graph-wrapper" id="graphContainer">
            <svg id="chartSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        </div>

        <div class="footer-stats">
            <div>Totalt: <span class="footer-val c-dist" id="lifeDist">0.000 km</span></div>
            <div>Tid: <span class="footer-val" id="lifeTime">0h 0m</span></div>
            <div>Pass: <span class="footer-val" id="sessCount">0</span></div>
        </div>

        <div class="file-controls">
            <!-- Punkt 5: Renamed buttons -->
            <button class="btn-sec" id="exportBtn">Spara (JSON)</button>
            <button class="btn-sec" onclick="document.getElementById('importFile').click()">Ladda upp (JSON)</button>
            <input type="file" id="importFile" style="display:none" accept=".json">
            <!-- Punkt 7: Statistik knapp -->
            <button class="btn-sec" id="statsBtn" style="border-color: var(--c-speed); color:var(--c-speed);">STATISTIK</button>
        </div>

    </div>
</div>

<!-- STATISTIK MODAL -->
<div class="modal" id="statsModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 style="margin:0">STATISTIKCENTRAL</h2>
            <button onclick="document.getElementById('statsModal').classList.remove('open')" style="width:auto; padding:10px 20px; background:transparent; border:1px solid #555;">Stäng</button>
        </div>
        <div class="modal-body">
            
            <div class="stats-filter">
                <select id="filterYear" class="main-select"><option value="all">Alla År</option></select>
                <select id="filterMonth" class="main-select"><option value="all">Alla Månader</option></select>
                <select id="filterRes" class="main-select"><option value="all">Alla Motstånd</option></select>
            </div>

            <div class="stat-card-grid" id="statCards">
                <!-- Fylls med JS -->
            </div>

            <h3 style="border-bottom:1px solid #333; padding-bottom:10px; margin-top:30px;">PASSLISTA</h3>
            <div style="overflow-x:auto">
                <table class="session-table" id="sessTable">
                    <thead>
                        <tr>
                            <th onclick="sortSess('date')">Datum</th>
                            <th onclick="sortSess('dur')">Tid</th>
                            <th onclick="sortSess('dist')">Sträcka</th>
                            <th onclick="sortSess('watt')">Snitt Watt</th>
                            <th onclick="sortSess('hr')">Snitt Puls</th>
                            <th onclick="sortSess('speed')">Snitt Fart</th>
                            <th onclick="sortSess('cal')">Kalorier</th>
                        </tr>
                    </thead>
                    <tbody id="sessBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // --- UI REFERENSER ---
    const ui = {
        connectBtn: document.getElementById('connectBtn'),
        stopBtn: document.getElementById('stopBtn'),
        connStatus: document.getElementById('connStatus'),
        progBox: document.getElementById('progBox'),
        progFill: document.getElementById('progFill'),
        statusText: document.getElementById('statusText'),
        // Värden
        speed: document.getElementById('valSpeed'),
        watt: document.getElementById('valWatt'),
        cad: document.getElementById('valCad'),
        dist: document.getElementById('valDist'),
        cal: document.getElementById('valCal'),
        time: document.getElementById('valTime'),
        hr: document.getElementById('valHr'),
        res: document.getElementById('valRes'),
        // Knappar
        btnResUp: document.getElementById('btnResUp'),
        btnResDown: document.getElementById('btnResDown'),
        // Analys
        chart: document.getElementById('chartSvg'),
        graphRes: document.getElementById('graphRes'),
        configGrid: document.getElementById('configGrid'),
        // Footer
        lifeDist: document.getElementById('lifeDist'),
        lifeTime: document.getElementById('lifeTime'),
        sessCount: document.getElementById('sessCount'),
        // Stats Modal
        statsBtn: document.getElementById('statsBtn'),
        statsModal: document.getElementById('statsModal'),
        statCards: document.getElementById('statCards'),
        sessBody: document.getElementById('sessBody'),
        // Filter
        fYear: document.getElementById('filterYear'),
        fMonth: document.getElementById('filterMonth'),
        fRes: document.getElementById('filterRes')
    };

    // --- VARIABLER ---
    let iconsoleWrite = null;
    let pollInterval = null;
    let currentResistance = 1;
    let sessionData = []; 
    let startTime = null;
    let calcDist = 0;
    let lastRawDist = -1;
    let lastPktTime = 0;

    const SEQ = [
        { bytes: [0xF0, 0xA0, 0x01, 0x01, 0x92], expect: 0xB0 },
        { bytes: [0xF0, 0xA3, 0x01, 0x01, 0x01, 0x96], expect: 0xB3 },
        { bytes: [0xF0, 0xA4, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0xA0], expect: 0xB4 },
        { bytes: [0xF0, 0xA5, 0x01, 0x01, 0x02, 0x99], expect: 0xB5 }
    ];
    let seqIndex = 0;
    const READ_CMD = [0xF0, 0xA2, 0x01, 0x01, 0x94];
    const STOP_CMD = [0xF0, 0xA5, 0x01, 0x01, 0x04, 0x9B];

    // Historik med mer data för statistik
    let history = JSON.parse(localStorage.getItem('gymstick_v4_history')) || { sessions: [], totalDist: 0, totalTime: 0 };
    updateHistoryUI();

    // --- CONFIG & INIT ---
    const TIME_OPTS = [
        {v:'graph', t:'Grafen'},
        {v:5, t:'5s'}, {v:10, t:'10s'}, {v:30, t:'30s'},
        {v:60, t:'1m'}, {v:120, t:'2m'}, {v:300, t:'5m'},
        {v:600, t:'10m'}, {v:1800, t:'30m'}, {v:3600, t:'1h'}, {v:-1, t:'Tot'}
    ];
    const DEF_SELS = [60, 600, -1];
    const METRICS = [
        { key: 'w', title: 'EFFEKT', color: 'var(--c-watt)' },
        { key: 's', title: 'HASTIGHET', color: 'var(--c-speed)' },
        { key: 'c', title: 'KADENS', color: 'var(--c-cad)' },
        { key: 'h', title: 'PULS', color: 'var(--c-hr)' }
    ];

    function initConfigGrid() {
        ui.configGrid.innerHTML = '';
        METRICS.forEach(m => {
            const card = document.createElement('div');
            card.className = 'config-card single-mode';
            card.style.borderLeft = `3px solid ${m.color}`;
            
            const hdr = document.createElement('div');
            hdr.className = 'config-header';
            hdr.innerHTML = `
                <span class="config-title" style="color:${m.color}">
                    <input type="checkbox" id="chk_${m.key}" checked class="chk"> ${m.title}
                </span>
                <div class="config-opts">
                    <label><input type="checkbox" data-key="${m.key}" data-rows="2"> 2</label>
                    <label><input type="checkbox" data-key="${m.key}" data-rows="3"> 3</label>
                </div>
            `;
            card.appendChild(hdr);

            const avgCont = document.createElement('div');
            avgCont.className = 'avg-container';
            avgCont.id = `avgs_${m.key}`;

            for(let i=0; i<3; i++) {
                const row = document.createElement('div');
                row.className = 'avg-row';
                if(i > 0) row.style.display = 'none';
                
                const sel = document.createElement('select');
                sel.className = 'tiny-select';
                TIME_OPTS.forEach(opt => {
                    const o = document.createElement('option');
                    o.value = opt.v;
                    o.textContent = opt.t;
                    if(opt.v === DEF_SELS[i]) o.selected = true;
                    sel.appendChild(o);
                });
                sel.dataset.metric = m.key;
                sel.dataset.idx = i;
                sel.onchange = updateAverages;

                const val = document.createElement('span');
                val.className = 'avg-val';
                val.style.color = m.color;
                val.textContent = '-';
                val.id = `val_${m.key}_${i}`;

                row.appendChild(sel);
                row.appendChild(val);
                avgCont.appendChild(row);
            }
            card.appendChild(avgCont);
            ui.configGrid.appendChild(card);

            const inputs = hdr.querySelectorAll('input[type=checkbox][data-rows]');
            inputs.forEach(inp => {
                inp.onchange = (e) => {
                    const r = parseInt(e.target.dataset.rows);
                    const isChecked = e.target.checked;
                    const otherInp = hdr.querySelector(`input[data-rows="${r===3?2:3}"]`);
                    if(isChecked && otherInp) otherInp.checked = false;
                    
                    const chk2 = hdr.querySelector('input[data-rows="2"]').checked;
                    const chk3 = hdr.querySelector('input[data-rows="3"]').checked;
                    
                    avgCont.children[1].style.display = (chk2 || chk3) ? 'flex' : 'none';
                    avgCont.children[2].style.display = chk3 ? 'flex' : 'none';
                    
                    if(chk2 || chk3) card.classList.remove('single-mode');
                    else card.classList.add('single-mode');
                };
            });
            document.getElementById(`chk_${m.key}`).onchange = drawGraph;
        });
    }
    initConfigGrid();

    // --- BLUETOOTH ---
    ui.connectBtn.onclick = async () => {
        try {
            ui.statusText.textContent = "Söker enhet...";
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['fitness_machine'] }],
                optionalServices: ['0000fff0-0000-1000-8000-00805f9b34fb']
            });
            device.addEventListener('gattserverdisconnected', onDisconnect);
            
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
            const notifyChar = await service.getCharacteristic('0000fff1-0000-1000-8000-00805f9b34fb');
            await notifyChar.startNotifications();
            notifyChar.addEventListener('characteristicvaluechanged', handleData);
            
            iconsoleWrite = await service.getCharacteristic('0000fff2-0000-1000-8000-00805f9b34fb');
            
            ui.connectBtn.style.display = 'none';
            ui.progBox.style.display = 'block';
            startHandshake();

        } catch (e) { ui.statusText.textContent = "Fel: " + e.message; }
    };

    function onDisconnect() {
        ui.connStatus.textContent = "FRÅNKOPPLAD";
        ui.connStatus.style.color = "#555";
        ui.connectBtn.style.display = 'block';
        ui.stopBtn.style.display = 'none';
        ui.progBox.style.display = 'none';
        if(pollInterval) clearInterval(pollInterval);
    }

    async function send(bytes) {
        if(!iconsoleWrite) return;
        try { await iconsoleWrite.writeValue(new Uint8Array(bytes)); } catch(e){}
    }

    function startHandshake() { seqIndex = 0; sendNext(); }

    async function sendNext() {
        if (seqIndex >= SEQ.length) {
            ui.statusText.textContent = "";
            ui.progBox.style.display = 'none';
            ui.connStatus.textContent = "ANSLUTEN";
            ui.connStatus.style.color = "var(--c-speed)";
            ui.stopBtn.style.display = 'block';
            
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => send(READ_CMD), 1000);
            
            sessionData = [];
            startTime = Date.now();
            calcDist = 0; lastRawDist = -1; lastPktTime = Date.now();
            return;
        }
        const step = SEQ[seqIndex];
        ui.progFill.style.width = ((seqIndex / SEQ.length) * 100) + "%";
        ui.statusText.textContent = "Init: " + step.name;
        await send(step.bytes);
    }

    function handleData(event) {
        const data = new Uint8Array(event.target.value.buffer);

        if (seqIndex < SEQ.length) {
            if (data[0] === 0xF0 && data[1] === SEQ[seqIndex].expect) {
                seqIndex++;
                setTimeout(sendNext, 200);
                return;
            }
        }

        if (data.length >= 20 && data[0] === 0xF0 && data[1] === 0xB2) {
            const val = (h, l) => 100 * (data[h] - 1) + (data[l] - 1);

            const speed = val(6, 7) / 10;
            const rpm = val(8, 9);
            const rawDist = val(10, 11) / 10;
            const cal = val(12, 13);
            const hr = val(14, 15);
            const watt = val(16, 17) / 10;
            const level = data[18] - 1; 
            currentResistance = level;

            let tMin = data[4] - 1; if(tMin<0) tMin=0;
            let tSec = data[5] - 1; if(tSec<0) tSec=0;

            const now = Date.now();
            const dt = (now - lastPktTime) / 1000;
            lastPktTime = now;

            if (rawDist > lastRawDist && lastRawDist !== -1) {
                calcDist = rawDist;
            } else {
                if (speed > 0 && dt < 5) calcDist += (speed / 3600) * dt;
                if (calcDist > rawDist + 0.099) calcDist = rawDist + 0.099;
                if (calcDist < rawDist) calcDist = rawDist;
            }
            lastRawDist = rawDist;

            ui.speed.textContent = speed.toFixed(1);
            ui.watt.textContent = watt.toFixed(0);
            ui.cad.textContent = rpm;
            ui.hr.textContent = hr;
            ui.cal.textContent = cal;
            ui.res.textContent = level;
            ui.time.textContent = `${tMin}:${tSec.toString().padStart(2,'0')}`;
            ui.dist.textContent = calcDist.toFixed(3);

            if(startTime) {
                const elapsed = (Date.now() - startTime) / 1000;
                // Spara motstånd (l) för statistik
                sessionData.push({ t: elapsed, w: watt, s: speed, c: rpm, h: hr, l: level });
                
                if(sessionData.length % 2 === 0) {
                    updateAverages();
                    drawGraph();
                }
                // Punkt 6: Uppdatera realtidstotal
                updateHistoryUI(calcDist);
            }
        }
    }

    async function setRes(lvl) {
        if(lvl < 1) lvl = 1; if(lvl > 32) lvl = 32;
        const bLvl = lvl + 1;
        const bytes = [0xF0, 0xA6, 0x01, 0x01, bLvl];
        let sum = 0; for(let b of bytes) sum += b;
        bytes.push(sum & 0xFF);
        await send(bytes);
    }
    ui.btnResUp.onclick = () => setRes(currentResistance + 1);
    ui.btnResDown.onclick = () => setRes(currentResistance - 1);

    function updateAverages() {
        if(sessionData.length === 0) return;
        const now = sessionData[sessionData.length-1].t;
        const graphResVal = parseInt(ui.graphRes.value);

        function calc(metric) {
            for(let i=0; i<3; i++) {
                const sel = document.querySelector(`select[data-metric="${metric}"][data-idx="${i}"]`);
                const disp = document.getElementById(`val_${metric}_${i}`);
                if(!sel || !disp) continue;

                let timeWin = sel.value;
                if(timeWin === 'graph') timeWin = graphResVal; 
                else timeWin = parseInt(timeWin);
                
                let sum = 0, count = 0;
                const cutoff = (timeWin === -1) ? 0 : (now - timeWin);
                
                for(let j=sessionData.length-1; j>=0; j--) {
                    if(sessionData[j].t < cutoff) break;
                    // Punkt 9: Puls ignorerar nollor
                    if(metric === 'h' && sessionData[j][metric] === 0) continue;
                    
                    sum += sessionData[j][metric];
                    count++;
                }
                
                disp.textContent = count > 0 ? Math.round(sum/count) : '-';
            }
        }
        calc('w'); calc('s'); calc('c'); calc('h');
    }

    function drawGraph() {
        if(sessionData.length < 2) return;
        const res = parseInt(ui.graphRes.value);
        
        const buckets = [];
        sessionData.forEach(p => {
            const idx = Math.floor(p.t / res);
            if(!buckets[idx]) buckets[idx] = {c:0, w:0, s:0, c_rpm:0, h:0, t:idx*res};
            buckets[idx].c++;
            buckets[idx].w += p.w;
            buckets[idx].s += p.s;
            buckets[idx].c_rpm += p.c; 
            buckets[idx].h += p.h;
        });
        const valid = buckets.filter(b=>b);
        if(valid.length < 2) return;

        const svg = ui.chart;
        svg.innerHTML = ''; 

        function makePoly(metricKey, color, maxVal, width, height) {
            let pts = "";
            valid.forEach((b, i) => {
                const x = (i / (valid.length - 1)) * width;
                const val = b[metricKey] / b.c;
                const y = height - ((val / maxVal) * height);
                pts += `${x},${y} `;
            });
            const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            line.setAttribute("points", pts);
            line.setAttribute("stroke", color);
            line.setAttribute("fill", "none");
            line.setAttribute("stroke-width", "2"); // Tunnare linjer (Punkt 3)
            return line;
        }

        const active = [];
        if(document.getElementById('chk_w').checked) active.push({key:'w', color:'var(--c-watt)', lbl:'W'});
        if(document.getElementById('chk_s').checked) active.push({key:'s', color:'var(--c-speed)', lbl:'km/h'});
        if(document.getElementById('chk_c').checked) active.push({key:'c_rpm', color:'var(--c-cad)', lbl:'rpm'});
        if(document.getElementById('chk_h').checked) active.push({key:'h', color:'var(--c-hr)', lbl:'bpm'});

        if(active.length === 0) return;

        // Rita axlar (Punkt 3: 0-100 koordinatsystem, men SVG-skalning hanterar det)
        active.forEach((m, idx) => {
            const max = Math.max(...valid.map(b => b[m.key]/b.c)) || 100;
            const scaledMax = max * 1.1; 

            svg.appendChild(makePoly(m.key, m.color, scaledMax, 100, 100));

            // Text i mikroskopisk font (3px) så den ser bra ut
            const xPos = (idx % 2 === 0) ? 1 : 90; 
            const yPos = 5 + (Math.floor(idx/2) * 5);
            
            const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
            txt.setAttribute("x", xPos);
            txt.setAttribute("y", yPos);
            txt.setAttribute("fill", m.color);
            txt.setAttribute("class", "axis-text");
            txt.textContent = `${Math.round(max)} ${m.lbl}`;
            svg.appendChild(txt);
        });
    }

    ui.graphRes.onchange = () => { updateAverages(); drawGraph(); };

    ui.stopBtn.onclick = async () => {
        if(confirm("Avsluta och spara pass?")) {
            await send(STOP_CMD);
            
            // Spara
            const d = parseFloat(ui.dist.textContent);
            const c = parseInt(ui.cal.textContent);
            const dur = sessionData.length > 0 ? sessionData[sessionData.length-1].t : 0;
            
            // Aggregat för statistik (Punkt 8)
            // Vi sparar inte rådata i "sessions" för evigt för att spara minne, men vi kan.
            // För "Stats"-vyn behöver vi aggregerade värden.
            
            history.sessions.push({
                date: new Date().toISOString(),
                dist: d,
                dur: dur,
                cal: c,
                data: sessionData // Vi behåller rådata för grafer
            });
            history.totalDist += d;
            history.totalTime += dur;
            
            saveHistory();
            onDisconnect();
        }
    };

    function updateHistoryUI(currentSessionDist = 0) {
        const tot = history.totalDist + currentSessionDist;
        ui.lifeDist.textContent = tot.toFixed(2) + " km";
        ui.sessCount.textContent = history.sessions.length;
        // Punkt 7: Total tid
        const h = Math.floor(history.totalTime / 3600);
        const m = Math.floor((history.totalTime % 3600) / 60);
        ui.lifeTime.textContent = `${h}h ${m}m`;
    }

    function saveHistory() {
        localStorage.setItem('gymstick_v4_history', JSON.stringify(history));
        updateHistoryUI();
    }

    // --- STATISTIK CENTRAL (Punkt 7, 8, 9) ---
    ui.statsBtn.onclick = () => {
        ui.statsModal.classList.add('open');
        renderStats();
    };

    let sortCol = 'date';
    let sortAsc = false;

    function renderStats() {
        // 1. Filtrera
        const yFilter = ui.fYear.value;
        const mFilter = ui.fMonth.value;
        const rFilter = ui.fRes.value;

        // Fyll filter-dropdowns om tomma
        if(ui.fYear.children.length === 1) {
            const years = [...new Set(history.sessions.map(s => new Date(s.date).getFullYear()))];
            years.sort().reverse().forEach(y => ui.fYear.add(new Option(y, y)));
            // Resistances
            for(let i=1; i<=32; i++) ui.fRes.add(new Option("Nivå " + i, i));
            // Månader
            for(let i=0; i<12; i++) ui.fMonth.add(new Option(new Date(0,i).toLocaleString('sv',{month:'long'}), i));
        }

        let filtered = history.sessions.filter(s => {
            const d = new Date(s.date);
            if(yFilter !== 'all' && d.getFullYear() != yFilter) return false;
            if(mFilter !== 'all' && d.getMonth() != mFilter) return false;
            
            // Motståndsfilter (Punkt 8): Kolla om passet innehåller detta motstånd
            if(rFilter !== 'all') {
                const targetRes = parseInt(rFilter);
                // Har vi kört på denna nivå?
                const hasRes = s.data.some(p => p.l === targetRes);
                if(!hasRes) return false;
            }
            return true;
        });

        // 2. Beräkna Totaler för urvalet
        let totDist=0, totTime=0, totCal=0, sumSpeed=0, sumCad=0, sumWatt=0, points=0;
        
        filtered.forEach(s => {
            totDist += s.dist;
            totTime += s.dur;
            totCal += s.cal;
            
            // För medelvärden: loopa data points
            s.data.forEach(p => {
                // Motståndsfilter logic: Räkna bara tid/distans på denna nivå om valt
                if(rFilter !== 'all' && p.l != rFilter) return;
                
                sumSpeed += p.s;
                sumCad += p.c;
                sumWatt += p.w;
                points++;
            });
        });

        // Om vi filtrerar på motstånd, måste vi räkna om totTime/Dist baserat på points
        // Enkel approximation: varje punkt är ca 1-2 sekunder. Vi kör på points.
        // För exakthet borde vi spara dt per punkt. Men detta duger för översikt.
        
        const avgSpeed = points ? (sumSpeed/points).toFixed(1) : 0;
        const avgCad = points ? Math.round(sumCad/points) : 0;
        const avgWatt = points ? Math.round(sumWatt/points) : 0;

        // Rita kort
        ui.statCards.innerHTML = `
            <div class="big-stat-card"><span class="big-stat-val c-dist">${totDist.toFixed(1)} km</span><span class="big-stat-lbl">Sträcka</span></div>
            <div class="big-stat-card"><span class="big-stat-val">${(totTime/60).toFixed(0)} min</span><span class="big-stat-lbl">Tid</span></div>
            <div class="big-stat-card"><span class="big-stat-val c-cal">${totCal}</span><span class="big-stat-lbl">Kalorier</span></div>
            <div class="big-stat-card"><span class="big-stat-val c-speed">${avgSpeed}</span><span class="big-stat-lbl">Snitt Fart</span></div>
            <div class="big-stat-card"><span class="big-stat-val c-watt">${avgWatt}</span><span class="big-stat-lbl">Snitt Watt</span></div>
            <div class="big-stat-card"><span class="big-stat-val c-cad">${avgCad}</span><span class="big-stat-lbl">Snitt Kadens</span></div>
        `;

        // 3. Tabell
        // Sortera
        filtered.sort((a,b) => {
            let valA, valB;
            // Helper to get avg from session data
            const getAvg = (s, k) => s.data.reduce((acc,v)=>acc+v[k],0)/s.data.length || 0;
            
            if(sortCol === 'date') { valA=new Date(a.date); valB=new Date(b.date); }
            else if(sortCol === 'dur') { valA=a.dur; valB=b.dur; }
            else if(sortCol === 'dist') { valA=a.dist; valB=b.dist; }
            else if(sortCol === 'cal') { valA=a.cal; valB=b.cal; }
            else if(sortCol === 'watt') { valA=getAvg(a,'w'); valB=getAvg(b,'w'); }
            else if(sortCol === 'hr') { valA=getAvg(a,'h'); valB=getAvg(b,'h'); }
            else if(sortCol === 'speed') { valA=getAvg(a,'s'); valB=getAvg(b,'s'); }
            
            return sortAsc ? (valA > valB ? 1 : -1) : (valA < valB ? 1 : -1);
        });

        ui.sessBody.innerHTML = filtered.map(s => {
            const d = new Date(s.date);
            const dateStr = d.toLocaleDateString('fi-FI') + ' ' + d.toLocaleTimeString('fi-FI', {hour:'2-digit', minute:'2-digit'});
            const getAvg = (k) => Math.round(s.data.reduce((acc,v)=>acc+v[k],0)/s.data.length || 0);
            const getAvgHr = () => { // Punkt 9: Puls > 0
                const validP = s.data.filter(p=>p.h>0);
                return validP.length ? Math.round(validP.reduce((acc,v)=>acc+v.h,0)/validP.length) : 0;
            };
            
            return `<tr>
                <td>${dateStr}</td>
                <td>${(s.dur/60).toFixed(0)}m</td>
                <td class="c-dist">${s.dist.toFixed(2)}</td>
                <td class="c-watt">${getAvg('w')}</td>
                <td class="c-hr">${getAvgHr()}</td>
                <td class="c-speed">${(s.data.reduce((acc,v)=>acc+v.s,0)/s.data.length).toFixed(1)}</td>
                <td class="c-cal">${s.cal}</td>
            </tr>`;
        }).join('');
    }

    window.sortSess = (col) => {
        if(sortCol === col) sortAsc = !sortAsc;
        else { sortCol = col; sortAsc = false; } // Default ny kolumn = fallande (högst/nyast först)
        renderStats();
    };

    [ui.fYear, ui.fMonth, ui.fRes].forEach(el => el.onchange = renderStats);

    // Import/Export
    document.getElementById('exportBtn').onclick = () => {
        const b = new Blob([JSON.stringify(history)],{type:'application/json'});
        const a =document.createElement('a'); a.href=URL.createObjectURL(b); a.download='gymstick_history.json'; a.click();
    };
    document.getElementById('importFile').onchange = (e) => {
        const r = new FileReader();
        r.onload = (ev) => {
            try {
                history = JSON.parse(ev.target.result);
                localStorage.setItem('gymstick_v4_history', JSON.stringify(history));
                updateHistoryUI();
                renderStats();
                alert("Data uppladdad!");
            } catch(x){alert("Fel fil");}
        };
        r.readAsText(e.target.files[0]);
    };

</script>
