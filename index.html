<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymstick GB8.0 Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; }
        #status { color: gray; margin-bottom: 20px; }
        #data-display { font-size: 24px; font-weight: bold; margin-top: 20px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>

    <h1>Gymstick GB8.0 Testare</h1>
    <p>Se till att bluetooth är på och cykeln är igång.</p>

    <button id="connectBtn">Anslut till cykel</button>
    <button id="disconnectBtn" disabled>Koppla från</button>

    <div id="status">Väntar på anslutning...</div>
    
    <div id="data-display">
        RPM: <span id="rpm">0</span> | 
        Hastighet: <span id="speed">0.0</span> km/h | 
        Watt: <span id="watt">0</span>
    </div>

    <script>
        // UUIDs baserat på din cykel och iConsole-protokollet
        const SERVICE_UUID = 0xFF10;
        const WRITE_UUID   = 0xFF11; // Skicka kommandon här
        const NOTIFY_UUID  = 0xFF12; // Lyssna på data här

        // Handslaget (Byte-sekvenser från IConsole.java)
        const COMMANDS = {
            PING:    [0xF0, 0xA0, 0x01, 0x01, 0x92],
            INIT_A0: [0xF0, 0xA0, 0x02, 0x02, 0x94],
            STATUS:  [0xF0, 0xA1, 0x01, 0x01, 0x93],
            INIT_A3: [0xF0, 0xA3, 0x01, 0x01, 0x01, 0x96],
            INIT_A4: [0xF0, 0xA4, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0xA0],
            START:   [0xF0, 0xA5, 0x01, 0x01, 0x02, 0x99],
            READ:    [0xF0, 0xA2, 0x01, 0x01, 0x94] // Polling-kommando
        };

        let device, server, service, writeChar, notifyChar;
        let pollingInterval;

        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const statusDiv = document.getElementById('status');

        connectBtn.addEventListener('click', connect);
        disconnectBtn.addEventListener('click', disconnect);

        async function connect() {
            try {
                statusDiv.innerText = "Söker efter cykel...";
                
                // 1. Sök efter enhet
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }],
                    optionalServices: [SERVICE_UUID]
                });

                statusDiv.innerText = "Ansluter till GATT Server...";
                server = await device.gatt.connect();

                statusDiv.innerText = "Hämtar Service...";
                service = await server.getPrimaryService(SERVICE_UUID);

                statusDiv.innerText = "Hämtar Characteristics...";
                writeChar = await service.getCharacteristic(WRITE_UUID);
                notifyChar = await service.getCharacteristic(NOTIFY_UUID);

                // 2. Börja lyssna på svar
                await notifyChar.startNotifications();
                notifyChar.addEventListener('characteristicvaluechanged', handleData);

                statusDiv.innerText = "Utför handslag...";
                statusDiv.className = "success";

                // 3. Utför det hemliga handslaget
                await sendCommand(COMMANDS.PING);
                await sleep(100);
                await sendCommand(COMMANDS.INIT_A0);
                await sleep(100);
                await sendCommand(COMMANDS.STATUS);
                await sleep(100);
                await sendCommand(COMMANDS.INIT_A3);
                await sleep(100);
                await sendCommand(COMMANDS.INIT_A4);
                await sleep(200);
                await sendCommand(COMMANDS.START);
                
                statusDiv.innerText = "Ansluten! Läser data...";
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;

                // 4. Starta loop som frågar efter data varje sekund
                startPolling();

            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Fel: " + error;
                statusDiv.className = "error";
            }
        }

        function disconnect() {
            if (device && device.gatt.connected) {
                device.gatt.disconnect();
            }
            clearInterval(pollingInterval);
            statusDiv.innerText = "Frånkopplad.";
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
        }

        async function sendCommand(bytes) {
            let buffer = new Uint8Array(bytes);
            await writeChar.writeValue(buffer);
        }

        function startPolling() {
            pollingInterval = setInterval(() => {
                if (device && device.gatt.connected) {
                    sendCommand(COMMANDS.READ);
                }
            }, 1000); // Polla varje sekund
        }

        // Hjälpfunktion för att pausa
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 5. Tolka datan från cykeln
        function handleData(event) {
            const value = event.target.value;
            const bytes = new Uint8Array(value.buffer);

            // Kolla om det är ett datasvar (börjar ofta på F0 B2)
            // Vi använder formeln: 100 * (byte - 1) + (nästa_byte - 1)
            if (bytes.length > 10) { 
                
                // RPM ligger på byte 8 och 9 (index 0-baserat)
                let rpm = 100 * (bytes[8] - 1) + (bytes[9] - 1);
                
                // Hastighet ligger på byte 6 och 7
                let speedRaw = 100 * (bytes[6] - 1) + (bytes[7] - 1);
                let speed = speedRaw / 10; // Dela med 10 för km/h

                // Watt ligger på byte 16 och 17
                let watt = 0;
                if(bytes.length > 17) {
                    watt = 100 * (bytes[16] - 1) + (bytes[17] - 1);
                }

                // Uppdatera skärmen
                document.getElementById('rpm').innerText = rpm;
                document.getElementById('speed').innerText = speed.toFixed(1);
                document.getElementById('watt').innerText = watt;
            }
        }
    </script>
</body>
</html>
