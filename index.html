<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymstick iConsole Fix</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1a1a1a;
            --text-main: #00ff00;
            --border-color: #333;
        }

        body { 
            font-family: 'Courier New', monospace; 
            background: var(--bg-color); 
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard { 
            background: var(--card-bg); 
            border: 1px solid var(--text-main);
            padding: 20px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        .header-row { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px;}
        .big-val { font-size: 2rem; font-weight: bold; }
        .label { font-size: 0.8rem; opacity: 0.7; }

        button { 
            background: #004400; 
            color: #00ff00; 
            border: 1px solid #00ff00; 
            padding: 15px; 
            width: 100%; 
            font-family: inherit; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
        }
        button:hover { background: #006600; }
        button:disabled { border-color: #555; color: #555; background: #111; cursor: not-allowed; }

        /* LOGG FÖNSTER */
        .log-window {
            width: 100%;
            max-width: 800px;
            height: 400px;
            background: #111;
            border: 1px solid #555;
            overflow-y: scroll;
            font-size: 11px;
            padding: 10px;
            white-space: pre-wrap;
            margin-top: 20px;
            color: #ccc;
        }
        
        .log-data { color: #00ffff; font-weight: bold; }
        .log-info { color: #888; }
        .log-err { color: #ff5555; }
        .log-succ { color: #00ff00; font-weight: bold; }

        .action-row { display: flex; gap: 10px; width: 100%; max-width: 800px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header-row">
        <div>Gymstick / iConsole Hacking</div>
        <div id="status">Väntar...</div>
    </div>
    
    <div style="margin-bottom:20px; color:#aaa; font-size:0.9rem;">
        Försöker väcka iConsole genom att skicka magiska bytes till FFF2.
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
        <div>Hastighet: <span id="speed" style="color:white; font-size:1.2em">0.0</span></div>
        <div>Watt: <span id="watt" style="color:white; font-size:1.2em">0</span></div>
    </div>

    <button id="connectBtn">ANSLUT & VÄCK CYKEL</button>
</div>

<div class="action-row">
    <button id="dlLogBtn">SPARA LOGG-FIL</button>
    <button id="resetBtn" style="background:#330000; border-color:red; color:red">LADDA OM</button>
</div>

<div class="log-window" id="logOutput">Loggen visas här...</div>

<script>
    const connectBtn = document.getElementById('connectBtn');
    const dlLogBtn = document.getElementById('dlLogBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusEl = document.getElementById('status');
    const logOut = document.getElementById('logOutput');
    const ui = {
        speed: document.getElementById('speed'),
        watt: document.getElementById('watt')
    };

    let fullLog = []; 

    function log(msg, type = 'info') {
        const time = new Date().toLocaleTimeString();
        const line = `[${time}] ${msg}`;
        fullLog.push(line);
        
        const span = document.createElement('div');
        span.textContent = line;
        if(type === 'data') span.className = 'log-data';
        if(type === 'err') span.className = 'log-err';
        if(type === 'succ') span.className = 'log-succ';
        if(type === 'info') span.className = 'log-info';
        
        logOut.appendChild(span);
        logOut.scrollTop = logOut.scrollHeight;
    }

    resetBtn.addEventListener('click', () => location.reload());

    dlLogBtn.addEventListener('click', () => {
        const blob = new Blob([fullLog.join('\n')], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "gymstick_iconsole_debug.txt";
        a.click();
    });

    connectBtn.addEventListener('click', async () => {
        try {
            statusEl.textContent = "Söker...";
            log("--- STARTAR ANSLUTNING ---");
            
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['fitness_machine'] }],
                optionalServices: [
                    'fitness_machine', 
                    // iConsole UUIDs (VIKTIGA)
                    '0000fff0-0000-1000-8000-00805f9b34fb'
                ]
            });

            device.addEventListener('gattserverdisconnected', () => {
                log("!!! FRÅNKOPPLAD !!!", 'err');
                statusEl.textContent = "Frånkopplad";
                connectBtn.disabled = false;
            });

            log(`Vald: ${device.name}`);
            
            const server = await device.gatt.connect();
            log("GATT Ansluten!", 'succ');

            // 1. Starta lyssning på FTMS (om den vaknar)
            try {
                const ftms = await server.getPrimaryService('fitness_machine');
                const dataChar = await ftms.getCharacteristic('00002ad2-0000-1000-8000-00805f9b34fb');
                await dataChar.startNotifications();
                dataChar.addEventListener('characteristicvaluechanged', (e) => handleData(e, 'FTMS'));
                log("Lyssnar på FTMS (2AD2)", 'info');
                
                // Försök standard start
                const cp = await ftms.getCharacteristic('00002ad9-0000-1000-8000-00805f9b34fb');
                await cp.startNotifications();
                await cp.writeValue(new Uint8Array([0x00])); // Reset
                setTimeout(() => cp.writeValue(new Uint8Array([0x07])), 500); // Start
                
            } catch (e) { log("Kunde inte starta FTMS: " + e, 'err'); }

            // 2. Starta lyssning på iConsole (FFF0)
            try {
                const iconsole = await server.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
                log("Hittade iConsole Service (FFF0)!", 'succ');
                
                const notifyChar = await iconsole.getCharacteristic('0000fff1-0000-1000-8000-00805f9b34fb');
                await notifyChar.startNotifications();
                notifyChar.addEventListener('characteristicvaluechanged', (e) => handleData(e, 'ICONSOLE'));
                log("Lyssnar på iConsole Data (FFF1)", 'info');

                // 3. SKICKA MAGISKA BYTES TILL FFF2
                const writeChar = await iconsole.getCharacteristic('0000fff2-0000-1000-8000-00805f9b34fb');
                log("Hittade skrivkanal (FFF2). Försöker väcka...", 'info');

                // iConsole Handshake ping (Bara för att säga 'Hej')
                const ping = new Uint8Array([0xF0]);
                log("Skickar PING: F0", 'info');
                await writeChar.writeValue(ping);

            } catch (e) { log("Ingen iConsole Service hittades: " + e, 'err'); }

            statusEl.textContent = "Ansluten. Trampa!";
            connectBtn.disabled = true;

        } catch (err) {
            log("CRITICAL ERROR: " + err, 'err');
            statusEl.textContent = "Fel!";
        }
    });

    function handleData(event, type) {
        const value = event.target.value;
        const raw = new Uint8Array(value.buffer);
        
        // HEX string
        let hex = [];
        for(let b of raw) hex.push(b.toString(16).padStart(2,'0').toUpperCase());
        const hexStr = hex.join(" ");
        
        log(`DATA [${type}]: ${hexStr}`, 'data');

        // Om vi får data på iConsole (FFF1), försök tolka den
        // iConsole format varierar, men ofta:
        // Header: F2, Len, ... Data ... CS
        if (type === 'ICONSOLE' && raw.length > 5) {
            // Detta är en gissning på formatet, vi justerar när vi ser din logg
            // Ofta ligger hastighet/watt på fasta positioner
            log("Fick data från iConsole! Analyserar...", 'succ');
        }
        
        // Om vi får data på FTMS (2AD2)
        if (type === 'FTMS' && raw.length > 2) {
             const speedRaw = new DataView(value.buffer).getUint16(2, true);
             ui.speed.textContent = (speedRaw / 100).toFixed(1);
             log("Fick data från FTMS!", 'succ');
        }
    }

</script>

</body>
</html>
