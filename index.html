<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymstick Java Protocol v14</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --border-color: #30363d;
            --accent: #58a6ff;
            --accent-green: #238636;
            --accent-orange: #d29922;
        }

        body { 
            font-family: 'Segoe UI', monospace; 
            background: var(--bg-color); 
            color: var(--text-main);
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
        }

        .dashboard { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        /* DATA GRID */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .data-box {
            background: #0d1117;
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
            border-radius: 4px;
        }
        .data-val { font-size: 1.5rem; font-weight: bold; color: var(--text-main); }
        .data-lbl { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }

        /* BUTTONS */
        button { 
            background: var(--accent-green); 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 4px;
            font-weight: bold; 
            cursor: pointer; 
            font-size: 1rem;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }

        #connectBtn { background: var(--accent); }
        #startSeqBtn { background: var(--accent-orange); display: none; }

        /* LOG */
        .log-window {
            width: 100%;
            max-width: 600px;
            height: 300px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            overflow-y: scroll;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
        
        .l-tx { color: #58a6ff; }
        .l-rx { color: #3fb950; font-weight: bold; }
        .l-err { color: #f85149; }
        .l-info { color: #8b949e; }

    </style>
</head>
<body>

<div class="dashboard">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid var(--border-color); padding-bottom:5px;">
        <strong>Gymstick Java Protocol v14</strong>
        <span id="status">Ej ansluten</span>
    </div>

    <button id="connectBtn">1. ANSLUT</button>
    <button id="startSeqBtn">2. KÖR JAVA-STARTSEKVENS</button>

    <!-- Realtidsdata -->
    <div class="data-grid">
        <div class="data-box">
            <div class="data-lbl">Hastighet</div>
            <div class="data-val" id="valSpeed">0.0</div>
        </div>
        <div class="data-box">
            <div class="data-lbl">Effekt (Watt)</div>
            <div class="data-val" id="valWatt">0</div>
        </div>
        <div class="data-box">
            <div class="data-lbl">Tid</div>
            <div class="data-val" id="valTime">00:00</div>
        </div>
        <div class="data-box">
            <div class="data-lbl">Distans</div>
            <div class="data-val" id="valDist">0.0</div>
        </div>
        <div class="data-box">
            <div class="data-lbl">Kadens</div>
            <div class="data-val" id="valRpm">0</div>
        </div>
        <div class="data-box">
            <div class="data-lbl">Puls</div>
            <div class="data-val" id="valHr">0</div>
        </div>
    </div>
</div>

<div style="width:100%; max-width:600px; display:flex; gap:10px; margin-bottom:5px;">
    <button id="dlLogBtn" style="background:#21262d; flex:1; margin-bottom:0; padding:10px;">Spara Logg</button>
    <button id="clearLogBtn" style="background:#21262d; flex:1; margin-bottom:0; padding:10px;">Rensa</button>
</div>

<div class="log-window" id="logOutput">Redo...</div>

<script>
    // --- UI ---
    const ui = {
        status: document.getElementById('status'),
        log: document.getElementById('logOutput'),
        speed: document.getElementById('valSpeed'),
        watt: document.getElementById('valWatt'),
        time: document.getElementById('valTime'),
        dist: document.getElementById('valDist'),
        rpm: document.getElementById('valRpm'),
        hr: document.getElementById('valHr'),
        connectBtn: document.getElementById('connectBtn'),
        startSeqBtn: document.getElementById('startSeqBtn')
    };

    let iconsoleWriteChar = null; // FFF2
    let pollInterval = null;
    let fullLog = [];

    // --- PROTOKOLL-DEFINITIONER (Från Java-koden) ---
    const CMDS = {
        PING:    [0xF0, 0xA0, 0x01, 0x01, 0x92],
        INIT_A0: [0xF0, 0xA0, 0x02, 0x02, 0x94],
        STATUS:  [0xF0, 0xA1, 0x01, 0x01, 0x93],
        INIT_A3: [0xF0, 0xA3, 0x01, 0x01, 0x01, 0x96],
        // INIT_A4 är lång: F0 A4 + 11 st 0x01 + A0
        INIT_A4: [0xF0, 0xA4, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0xA0],
        START:   [0xF0, 0xA5, 0x01, 0x01, 0x02, 0x99],
        READ:    [0xF0, 0xA2, 0x01, 0x01, 0x94]
    };

    // --- LOGGNING ---
    function log(msg, type = 'info') {
        const time = new Date().toLocaleTimeString().split(' ')[0];
        const line = `[${time}] ${msg}`;
        fullLog.push(line);
        const div = document.createElement('div');
        div.textContent = line;
        div.className = 'l-' + type;
        ui.log.appendChild(div);
        ui.log.scrollTop = ui.log.scrollHeight;
    }

    document.getElementById('clearLogBtn').onclick = () => { ui.log.innerHTML = ''; fullLog = []; };
    document.getElementById('dlLogBtn').onclick = () => {
        const blob = new Blob([fullLog.join('\n')], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "gymstick_v14_log.txt";
        a.click();
    };

    // --- ANSLUTNING ---
    ui.connectBtn.onclick = async () => {
        try {
            ui.status.textContent = "Söker...";
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['fitness_machine'] }],
                optionalServices: ['0000fff0-0000-1000-8000-00805f9b34fb']
            });

            device.addEventListener('gattserverdisconnected', onDisconnected);
            log(`Ansluter till ${device.name}...`, 'info');
            
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
            
            // Lyssna (FFF1)
            const notifyChar = await service.getCharacteristic('0000fff1-0000-1000-8000-00805f9b34fb');
            await notifyChar.startNotifications();
            notifyChar.addEventListener('characteristicvaluechanged', handleData);
            
            // Skriv (FFF2)
            iconsoleWriteChar = await service.getCharacteristic('0000fff2-0000-1000-8000-00805f9b34fb');
            
            log("Ansluten till iConsole (FFF0).", 'info');
            ui.status.textContent = "Ansluten";
            ui.connectBtn.style.display = 'none';
            ui.startSeqBtn.style.display = 'block';

        } catch (e) {
            log("Fel: " + e, 'err');
        }
    };

    function onDisconnected() {
        log("Frånkopplad!", 'err');
        ui.status.textContent = "Frånkopplad";
        ui.connectBtn.style.display = 'block';
        ui.connectBtn.disabled = false;
        ui.startSeqBtn.style.display = 'none';
        if (pollInterval) clearInterval(pollInterval);
    }

    // --- SÄNDNING ---
    async function send(bytes, name) {
        if (!iconsoleWriteChar) return;
        try {
            const hex = bytes.map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
            log(`TX [${name}]: ${hex}`, 'tx');
            await iconsoleWriteChar.writeValue(new Uint8Array(bytes));
        } catch (e) { log("Sändfel: " + e, 'err'); }
    }

    // --- SEKVENSEN ---
    ui.startSeqBtn.onclick = async () => {
        ui.startSeqBtn.disabled = true;
        log("--- STARTAR SEKVENS ---", 'info');

        // Detta är en "Blind" sekvens (vi väntar en stund mellan varje kommando)
        // Eftersom web-bluetooth kan vara segt med events, kör vi timings.
        
        await send(CMDS.PING, "PING");
        await delay(500);
        
        await send(CMDS.INIT_A0, "INIT_A0");
        await delay(500);
        
        await send(CMDS.STATUS, "STATUS");
        await delay(500);
        
        await send(CMDS.INIT_A3, "INIT_A3");
        await delay(500);
        
        await send(CMDS.INIT_A4, "INIT_A4");
        await delay(500);
        
        await send(CMDS.START, "START");
        await delay(1000);
        
        log("Sekvens klar. Startar POLLING (Läsning)...", 'info');
        
        // Starta loopen som hämtar data varje sekund
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(() => {
            send(CMDS.READ, "READ");
        }, 1000); // Enligt java-koden: 500ms vid READ-state, vi kör 1s för att vara snälla
    };

    function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    // --- DATATOLKNING (Den hemliga formeln) ---
    function handleData(event) {
        const data = new Uint8Array(event.target.value.buffer);
        const hex = Array.from(data).map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
        
        // Filtrera bort "ACK" svar (De som börjar på F0 B...) så vi inte spammar loggen
        if (data[0] === 0xF0 && (data[1] & 0xF0) === 0xB0) {
            // Detta är bara ett "OK" från cykeln, vi behöver inte logga varje gång
            // log(`RX ACK: ${hex}`, 'info'); 
            return;
        }

        log(`RX DATA: ${hex}`, 'rx');

        // Kolla om det är ett svar på READ (F0 B2 ...) och att längden är tillräcklig
        // Java: mDataListener.onData(new Data(got));
        // Data-klassen säger:
        // Time = bytes[2]..bytes[5] (komplicerat)
        // Speed = 100 * (bytes[6]-1) + bytes[7]-1
        // RPM = 100 * (bytes[8]-1) + bytes[9]-1
        // Dist = 100 * (bytes[10]-1) + bytes[11]-1
        // Cal = 100 * (bytes[12]-1) + bytes[13]-1
        // Watt = 100 * (bytes[16]-1) + bytes[17]-1
        
        // Vi antar att paketet börjar på F0 B2 och har rätt längd (ca 20-21 bytes)
        if (data.length >= 20) {
            
            // Hjälpfunktion för det konstiga "-1" formatet
            const parseVal = (idxHigh, idxLow) => {
                return 100 * (data[idxHigh] - 1) + (data[idxLow] - 1);
            };

            const speed = parseVal(6, 7) / 10; // Java säger speed10, så vi delar med 10
            const rpm = parseVal(8, 9);
            const dist = parseVal(10, 11) / 10; // Java säger dist10
            const cal = parseVal(12, 13);
            const hr = parseVal(14, 15);
            const watt = parseVal(16, 17) / 10; // Java säger power10

            // Tid (förenklad)
            const min = data[4] - 1; 
            const sec = data[5] - 1;

            // Uppdatera UI
            ui.speed.textContent = speed.toFixed(1);
            ui.rpm.textContent = rpm;
            ui.dist.textContent = dist.toFixed(2);
            ui.watt.textContent = watt.toFixed(0);
            ui.hr.textContent = hr;
            ui.time.textContent = `${min}:${sec.toString().padStart(2,'0')}`;
        }
    }

</script>

</body>
</html>
