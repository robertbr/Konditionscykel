<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymstick State Machine v15</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --border-color: #30363d;
            --accent: #58a6ff;
            --accent-green: #238636;
            --accent-red: #da3633;
            --accent-wait: #9e6a03;
        }

        body { 
            font-family: 'Segoe UI', monospace; 
            background: var(--bg-color); 
            color: var(--text-main);
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
        }

        .dashboard { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .data-box {
            background: #0d1117;
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
            border-radius: 4px;
        }
        .data-val { font-size: 1.5rem; font-weight: bold; color: var(--text-main); }
        .data-lbl { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }

        button { 
            background: var(--accent-green); 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 4px;
            font-weight: bold; 
            cursor: pointer; 
            font-size: 1rem;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }

        #connectBtn { background: var(--accent); }
        #startSeqBtn { background: var(--accent-wait); display: none; }
        #stopBtn { background: var(--accent-red); display: none; }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #30363d;
            border-radius: 5px;
            margin-bottom: 15px;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent-green);
            width: 0%;
            transition: width 0.3s;
        }

        .log-window {
            width: 100%;
            max-width: 600px;
            height: 300px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            overflow-y: scroll;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
        
        .l-tx { color: #58a6ff; }
        .l-rx { color: #3fb950; font-weight: bold; }
        .l-err { color: #f85149; }
        .l-info { color: #8b949e; }
        .l-state { color: var(--accent-orange); font-weight: bold; border-top: 1px dashed #333; margin-top: 5px; padding-top:5px; }

    </style>
</head>
<body>

<div class="dashboard">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid var(--border-color); padding-bottom:5px;">
        <strong>Gymstick SafeMode v15</strong>
        <span id="status">Ej ansluten</span>
    </div>

    <button id="connectBtn">1. ANSLUT</button>
    <div class="progress-bar" id="progBar"><div class="progress-fill" id="progFill"></div></div>
    <button id="startSeqBtn">2. STARTA SÄKER SEKVENS (Steg-för-steg)</button>
    <button id="stopBtn">NÖDSTOPP / STOPPA</button>

    <div class="data-grid">
        <div class="data-box">
            <div class="data-lbl">Hastighet</div>
            <div class="data-val" id="valSpeed">0.0</div>
        </div>
        <div class="data-box">
            <div class="data-lbl">Effekt (Watt)</div>
            <div class="data-val" id="valWatt">0</div>
        </div>
        <div class="data-box">
            <div class="data-lbl">Tid</div>
            <div class="data-val" id="valTime">00:00</div>
        </div>
        <div class="data-box">
            <div class="data-lbl">Distans</div>
            <div class="data-val" id="valDist">0.0</div>
        </div>
    </div>
</div>

<div style="width:100%; max-width:600px; display:flex; gap:10px; margin-bottom:5px;">
    <button id="dlLogBtn" style="background:#21262d; flex:1; margin-bottom:0; padding:10px;">Spara Logg</button>
    <button id="clearLogBtn" style="background:#21262d; flex:1; margin-bottom:0; padding:10px;">Rensa</button>
</div>

<div class="log-window" id="logOutput">Väntar på anslutning...</div>

<script>
    // --- UI ---
    const ui = {
        status: document.getElementById('status'),
        log: document.getElementById('logOutput'),
        speed: document.getElementById('valSpeed'),
        watt: document.getElementById('valWatt'),
        time: document.getElementById('valTime'),
        dist: document.getElementById('valDist'),
        connectBtn: document.getElementById('connectBtn'),
        startSeqBtn: document.getElementById('startSeqBtn'),
        stopBtn: document.getElementById('stopBtn'),
        progBar: document.getElementById('progBar'),
        progFill: document.getElementById('progFill')
    };

    let iconsoleWriteChar = null; // FFF2
    let readInterval = null;
    let fullLog = [];
    
    // STATES
    const STATE = {
        IDLE: 0,
        PING_SENT: 1,
        A0_SENT: 2,
        STATUS_SENT: 3,
        A3_SENT: 4,
        A4_SENT: 5,
        START_SENT: 6,
        RUNNING: 7
    };
    let currentState = STATE.IDLE;

    // --- PROTOKOLL (Exakt kopia från Java) ---
    const CMDS = {
        PING:    [0xF0, 0xA0, 0x01, 0x01, 0x92],
        INIT_A0: [0xF0, 0xA0, 0x02, 0x02, 0x94],
        STATUS:  [0xF0, 0xA1, 0x01, 0x01, 0x93],
        INIT_A3: [0xF0, 0xA3, 0x01, 0x01, 0x01, 0x96],
        INIT_A4: [0xF0, 0xA4, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0xA0],
        START:   [0xF0, 0xA5, 0x01, 0x01, 0x02, 0x99],
        READ:    [0xF0, 0xA2, 0x01, 0x01, 0x94]
    };

    // --- LOGGNING ---
    function log(msg, type = 'info') {
        const time = new Date().toLocaleTimeString().split(' ')[0];
        const line = `[${time}] ${msg}`;
        fullLog.push(line);
        const div = document.createElement('div');
        div.textContent = line;
        div.className = 'l-' + type;
        ui.log.appendChild(div);
        ui.log.scrollTop = ui.log.scrollHeight;
    }

    document.getElementById('clearLogBtn').onclick = () => { ui.log.innerHTML = ''; fullLog = []; };
    document.getElementById('dlLogBtn').onclick = () => {
        const blob = new Blob([fullLog.join('\n')], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "gymstick_v15_log.txt";
        a.click();
    };

    // --- ANSLUTNING ---
    ui.connectBtn.onclick = async () => {
        try {
            ui.status.textContent = "Söker...";
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['fitness_machine'] }],
                optionalServices: ['0000fff0-0000-1000-8000-00805f9b34fb']
            });

            device.addEventListener('gattserverdisconnected', onDisconnected);
            log(`Ansluter till ${device.name}...`, 'info');
            
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
            
            const notifyChar = await service.getCharacteristic('0000fff1-0000-1000-8000-00805f9b34fb');
            await notifyChar.startNotifications();
            notifyChar.addEventListener('characteristicvaluechanged', handleData);
            
            iconsoleWriteChar = await service.getCharacteristic('0000fff2-0000-1000-8000-00805f9b34fb');
            
            log("Ansluten till iConsole (FFF0).", 'info');
            ui.status.textContent = "Ansluten";
            ui.connectBtn.style.display = 'none';
            ui.startSeqBtn.style.display = 'block';

        } catch (e) {
            log("Fel: " + e, 'err');
        }
    };

    function onDisconnected() {
        log("Frånkopplad!", 'err');
        ui.status.textContent = "Frånkopplad";
        ui.connectBtn.style.display = 'block';
        ui.connectBtn.disabled = false;
        ui.startSeqBtn.style.display = 'none';
        ui.stopBtn.style.display = 'none';
        ui.progBar.style.display = 'none';
        if (readInterval) clearInterval(readInterval);
        currentState = STATE.IDLE;
    }

    // --- SÄNDNING ---
    async function send(bytes, name) {
        if (!iconsoleWriteChar) return;
        try {
            const hex = bytes.map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
            log(`TX [${name}]: ${hex}`, 'tx');
            await iconsoleWriteChar.writeValue(new Uint8Array(bytes));
        } catch (e) { log("Sändfel: " + e, 'err'); }
    }

    // --- SEKVENS-STYRNING ---
    ui.startSeqBtn.onclick = () => {
        ui.startSeqBtn.style.display = 'none';
        ui.stopBtn.style.display = 'block';
        ui.progBar.style.display = 'block';
        
        log("--- STARTAR STATE MACHINE ---", 'state');
        currentState = STATE.PING_SENT;
        updateProgress(10);
        send(CMDS.PING, "PING");
    };

    ui.stopBtn.onclick = () => {
        if (readInterval) clearInterval(readInterval);
        log("Stoppar manuellt.", 'err');
        onDisconnected(); // Enkel reset
    };

    function updateProgress(pct) {
        ui.progFill.style.width = pct + '%';
    }

    // --- DATA & STATE MACHINE ---
    function handleData(event) {
        const data = new Uint8Array(event.target.value.buffer);
        const hex = Array.from(data).map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
        
        // Ignorera vissa paket om vi vill, men vi loggar allt för säkerhets skull
        // log(`RX: ${hex}`, 'rx');

        // STATE MACHINE LOGIK
        // Java: processIOAck() kollar om mNextState ska ändras baserat på ACK
        // Om vi skickar A0 (Ping), förväntar vi oss B0 (Ack)
        
        const cmdId = data[1] & 0xF0; // T.ex. B0 från F0 B0 ...
        const isAck = (data[0] === 0xF0 && (cmdId === 0xB0));

        if (isAck) {
            log(`Fick ACK: ${hex}`, 'rx');
            
            // Hantera nästa steg
            switch (currentState) {
                case STATE.PING_SENT:
                    log("PING OK -> Skickar INIT_A0", 'state');
                    currentState = STATE.A0_SENT;
                    updateProgress(25);
                    setTimeout(() => send(CMDS.INIT_A0, "INIT_A0"), 100);
                    break;

                case STATE.A0_SENT:
                    log("INIT_A0 OK -> Skickar STATUS", 'state');
                    currentState = STATE.STATUS_SENT;
                    updateProgress(40);
                    setTimeout(() => send(CMDS.STATUS, "STATUS"), 100);
                    break;

                case STATE.STATUS_SENT:
                    log("STATUS OK -> Skickar INIT_A3", 'state');
                    currentState = STATE.A3_SENT;
                    updateProgress(55);
                    setTimeout(() => send(CMDS.INIT_A3, "INIT_A3"), 100);
                    break;

                case STATE.A3_SENT:
                    log("INIT_A3 OK -> Skickar INIT_A4", 'state');
                    currentState = STATE.A4_SENT;
                    updateProgress(70);
                    setTimeout(() => send(CMDS.INIT_A4, "INIT_A4"), 100);
                    break;

                case STATE.A4_SENT:
                    log("INIT_A4 OK -> Skickar START!", 'state');
                    currentState = STATE.START_SENT;
                    updateProgress(85);
                    setTimeout(() => send(CMDS.START, "START"), 100);
                    break;

                case STATE.START_SENT:
                    log("START OK! -> Går in i RUNNING Mode", 'state');
                    currentState = STATE.RUNNING;
                    updateProgress(100);
                    ui.progFill.style.backgroundColor = "#00ff00";
                    startReadLoop();
                    break;
                
                case STATE.RUNNING:
                    // Vi är igång! Om detta är ett svar på READ, parse it!
                    if (data.length >= 20) {
                        parseData(data);
                    }
                    break;
            }
        } else {
            // Det kanske är data ändå?
            if (currentState === STATE.RUNNING && data.length >= 20) {
                parseData(data);
            } else {
                log(`RX (Okänd): ${hex}`, 'info');
            }
        }
    }

    function startReadLoop() {
        // Enligt Java: Skicka READ (F0 A2...) regelbundet
        log("Startar READ-loop (varje sekund)...", 'info');
        readInterval = setInterval(() => {
            send(CMDS.READ, "READ");
        }, 1000);
    }

    function parseData(data) {
        // Java Data-klass logik:
        // Speed = 100 * (bytes[6]-1) + bytes[7]-1
        const parseVal = (h, l) => 100 * (data[h] - 1) + (data[l] - 1);

        // Säkerhetskoll
        if (data.length < 18) return;

        const speed = parseVal(6, 7) / 10;
        const rpm = parseVal(8, 9);
        const dist = parseVal(10, 11) / 10;
        const watt = parseVal(16, 17) / 10;
        const hr = parseVal(14, 15);
        
        // Tid (Byte 2-5 är krånglig i Java, förenklar här)
        // mTime = (((bytes[2]-1) * 24 + bytes[3]-1) * 60 +  bytes[4]-1) * 60 + bytes[5]-1
        // Det ser ut som Dagar, Timmar, Minuter, Sekunder
        const min = data[4] - 1;
        const sec = data[5] - 1;

        ui.speed.textContent = speed.toFixed(1);
        ui.watt.textContent = watt.toFixed(0);
        ui.dist.textContent = dist.toFixed(2);
        ui.time.textContent = `${min}:${sec.toString().padStart(2,'0')}`;
        
        // Logga bara ibland
        // log(`Data: ${speed} km/h, ${watt} W`, 'rx');
    }

</script>

</body>
</html>
