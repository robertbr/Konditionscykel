<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymstick Manual Probe</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1a1a1a;
            --text-main: #00ff00;
            --border-color: #333;
        }

        body { 
            font-family: 'Courier New', monospace; 
            background: var(--bg-color); 
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard { 
            background: var(--card-bg); 
            border: 1px solid var(--text-main);
            padding: 20px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        .header-row { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px;}
        .big-val { font-size: 2rem; font-weight: bold; }
        .label { font-size: 0.8rem; opacity: 0.7; }

        button { 
            background: #004400; 
            color: #00ff00; 
            border: 1px solid #00ff00; 
            padding: 15px; 
            width: 100%; 
            font-family: inherit; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
        }
        button:hover { background: #006600; }
        button:disabled { border-color: #555; color: #555; background: #111; cursor: not-allowed; }

        /* TESTPANEL */
        .test-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
        .btn-cmd {
            padding: 10px;
            font-size: 0.8rem;
            background: #002244;
            border-color: #004488;
            color: #00aaff;
        }
        .btn-cmd:hover { background: #003366; }

        /* LOGG FÖNSTER */
        .log-window {
            width: 100%;
            max-width: 800px;
            height: 400px;
            background: #111;
            border: 1px solid #555;
            overflow-y: scroll;
            font-size: 11px;
            padding: 10px;
            white-space: pre-wrap;
            margin-top: 20px;
            color: #ccc;
        }
        
        .log-data { color: #00ffff; font-weight: bold; }
        .log-info { color: #888; }
        .log-err { color: #ff5555; }
        .log-succ { color: #00ff00; font-weight: bold; }

        .action-row { display: flex; gap: 10px; width: 100%; max-width: 800px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header-row">
        <div>Gymstick / iConsole Manual Probe</div>
        <div id="status">Väntar...</div>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
        <div>Hastighet: <span id="speed" style="color:white; font-size:1.2em">0.0</span></div>
        <div>Raw Data: <span id="lastRaw" style="color:#aaa; font-size:0.8em">--</span></div>
    </div>

    <button id="connectBtn">1. ANSLUT (Endast Lyssna)</button>

    <div class="test-panel">
        <button class="btn-cmd" id="btnA0">2. iConsole: Skicka A0</button>
        <button class="btn-cmd" id="btnB0">3. iConsole: Skicka B0</button>
        <button class="btn-cmd" id="btnStart">4. FTMS: Start (0x07)</button>
        <button class="btn-cmd" id="btnReset">5. FTMS: Reset (0x00)</button>
    </div>
    <div style="font-size:0.7rem; color:#666; text-align:center; margin-top:5px;">
        Tryck på knapparna en i taget och vänta 5s för att se om data kommer.
    </div>
</div>

<div class="action-row">
    <button id="dlLogBtn">SPARA LOGG-FIL</button>
    <button id="resetBtn" style="background:#330000; border-color:red; color:red">LADDA OM</button>
</div>

<div class="log-window" id="logOutput">Loggen visas här...</div>

<script>
    const connectBtn = document.getElementById('connectBtn');
    const dlLogBtn = document.getElementById('dlLogBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusEl = document.getElementById('status');
    const logOut = document.getElementById('logOutput');
    const ui = {
        speed: document.getElementById('speed'),
        lastRaw: document.getElementById('lastRaw')
    };

    // Bluetooth object cache
    let gattServer = null;
    let iconsoleWriteChar = null;
    let ftmsControlChar = null;

    let fullLog = []; 

    function log(msg, type = 'info') {
        const time = new Date().toLocaleTimeString();
        const line = `[${time}] ${msg}`;
        fullLog.push(line);
        
        const span = document.createElement('div');
        span.textContent = line;
        if(type === 'data') span.className = 'log-data';
        if(type === 'err') span.className = 'log-err';
        if(type === 'succ') span.className = 'log-succ';
        if(type === 'info') span.className = 'log-info';
        
        logOut.appendChild(span);
        logOut.scrollTop = logOut.scrollHeight;
    }

    resetBtn.addEventListener('click', () => location.reload());

    dlLogBtn.addEventListener('click', () => {
        const blob = new Blob([fullLog.join('\n')], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "gymstick_probe_log.txt";
        a.click();
    });

    // --- KNAPPAR FÖR MANUELL TESTNING ---
    document.getElementById('btnA0').addEventListener('click', () => sendIConsole([0xA0]));
    document.getElementById('btnB0').addEventListener('click', () => sendIConsole([0xB0]));
    document.getElementById('btnStart').addEventListener('click', () => sendFTMS([0x07]));
    document.getElementById('btnReset').addEventListener('click', () => sendFTMS([0x00]));

    async function sendIConsole(bytes) {
        if (!iconsoleWriteChar) { log("Ingen iConsole-kanal (FFF2) tillgänglig.", 'err'); return; }
        try {
            const hex = bytes.map(b => b.toString(16).toUpperCase()).join(' ');
            log(`Skickar till FFF2: ${hex}`, 'info');
            await iconsoleWriteChar.writeValue(new Uint8Array(bytes));
        } catch (e) { log("Fel vid skrivning till FFF2: " + e, 'err'); }
    }

    async function sendFTMS(bytes) {
        if (!ftmsControlChar) { log("Ingen FTMS Control Point (2AD9) tillgänglig.", 'err'); return; }
        try {
            const hex = bytes.map(b => b.toString(16).toUpperCase()).join(' ');
            log(`Skickar till 2AD9: ${hex}`, 'info');
            await ftmsControlChar.writeValue(new Uint8Array(bytes));
        } catch (e) { log("Fel vid skrivning till FTMS: " + e, 'err'); }
    }

    // --- HUVUDANSLUTNING ---
    connectBtn.addEventListener('click', async () => {
        try {
            statusEl.textContent = "Söker...";
            log("--- STARTAR ANSLUTNING (PASSIV) ---");
            
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['fitness_machine'] }],
                optionalServices: [
                    'fitness_machine', 
                    '0000fff0-0000-1000-8000-00805f9b34fb' // iConsole
                ]
            });

            device.addEventListener('gattserverdisconnected', () => {
                log("!!! FRÅNKOPPLAD !!!", 'err');
                statusEl.textContent = "Frånkopplad";
                connectBtn.disabled = false;
            });

            log(`Vald: ${device.name}`);
            gattServer = await device.gatt.connect();
            log("GATT Ansluten!", 'succ');

            // 1. FTMS Setup
            try {
                const ftms = await gattServer.getPrimaryService('fitness_machine');
                
                // Lyssna på Data
                const dataChar = await ftms.getCharacteristic('00002ad2-0000-1000-8000-00805f9b34fb');
                await dataChar.startNotifications();
                dataChar.addEventListener('characteristicvaluechanged', (e) => handleData(e, 'FTMS'));
                log("Lyssnar på FTMS (2AD2)", 'info');
                
                // Spara kontrollpunkt men SKRIV INTE än
                ftmsControlChar = await ftms.getCharacteristic('00002ad9-0000-1000-8000-00805f9b34fb');
                await ftmsControlChar.startNotifications(); // För svar
                log("FTMS Control Point (2AD9) redo.", 'info');
                
            } catch (e) { log("FTMS Setup Error: " + e, 'err'); }

            // 2. iConsole Setup
            try {
                const iconsole = await gattServer.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
                
                // Lyssna på Data (FFF1)
                const notifyChar = await iconsole.getCharacteristic('0000fff1-0000-1000-8000-00805f9b34fb');
                await notifyChar.startNotifications();
                notifyChar.addEventListener('characteristicvaluechanged', (e) => handleData(e, 'ICONSOLE'));
                log("Lyssnar på iConsole (FFF1)", 'info');

                // Spara skrivkanal (FFF2)
                iconsoleWriteChar = await iconsole.getCharacteristic('0000fff2-0000-1000-8000-00805f9b34fb');
                log("iConsole Write (FFF2) redo.", 'info');

            } catch (e) { log("iConsole Setup Error: " + e, 'err'); }

            statusEl.textContent = "Ansluten. Prova knapparna.";
            connectBtn.disabled = true;

        } catch (err) {
            log("CRITICAL ERROR: " + err, 'err');
            statusEl.textContent = "Fel!";
        }
    });

    function handleData(event, type) {
        const value = event.target.value;
        const raw = new Uint8Array(value.buffer);
        
        // HEX string
        let hex = [];
        for(let b of raw) hex.push(b.toString(16).padStart(2,'0').toUpperCase());
        const hexStr = hex.join(" ");
        
        log(`DATA [${type}]: ${hexStr}`, 'data');
        ui.lastRaw.textContent = hexStr;

        // --- TOLKNING ---
        
        // iConsole (FFF1) - Ofta F2 <len> <data> ...
        // Eller A0 <len> <data> ...
        if (type === 'ICONSOLE') {
            log("iConsole data mottagen!", 'succ');
            // Försök hitta hastighet. iConsole varierar, men ofta byte 4-5 eller 5-6
            // Vi loggar bara för analys nu
        }
        
        // FTMS (2AD2)
        if (type === 'FTMS' && raw.length > 2) {
             const speedRaw = new DataView(value.buffer).getUint16(2, true);
             ui.speed.textContent = (speedRaw / 100).toFixed(1);
             log("FTMS Data tolkad!", 'succ');
        }
    }

</script>

</body>
</html>
