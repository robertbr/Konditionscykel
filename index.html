<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymstick Pro Monitor v2.3</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-bg: #16213e;
            --border-color: #0f3460;
            --text-main: #fff;
            --text-dim: #8d99ae;
            --accent-primary: #e94560;
            --accent-secondary: #4cc9f0;
            --accent-speed: #23d5ab;
            --accent-cadence: #7209b7;
            --accent-watt: #f72585;
            --accent-cal: #fca311;
            --accent-res: #ffd166;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main);
            margin: 0; 
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- LAYOUT --- */
        .main-container {
            display: grid;
            gap: 20px;
            flex: 1;
            overflow: hidden;
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr;
        }

        @media (min-width: 950px) {
            .main-container {
                grid-template-columns: 400px 1fr;
                grid-template-rows: 1fr;
            }
        }

        .scrollable-panel {
            overflow-y: auto;
            height: 100%;
            padding-right: 5px;
        }

        /* --- VÄNSTER PANEL --- */
        .control-panel {
            background: var(--panel-bg);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            align-items: center;
        }
        
        .header-item h3 { margin: 0 0 5px 0; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .val-time { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
        .val-hr { font-size: 1.5rem; font-weight: 700; color: var(--accent-primary); }
        
        .res-wrapper { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .val-res { font-size: 1.8rem; font-weight: 800; color: var(--accent-res); line-height: 1; min-width: 40px; }
        .btn-res {
            width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--text-dim);
            background: transparent; color: #fff; cursor: pointer; font-weight: bold;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .btn-res:hover { background: var(--border-color); border-color: #fff; }

        .watt-display { text-align: center; margin: 10px 0; }
        .watt-val { font-size: 5rem; font-weight: 800; line-height: 0.9; color: var(--accent-watt); text-shadow: 0 0 25px rgba(247, 37, 133, 0.4); }
        .watt-unit { font-size: 1.2rem; font-weight: 700; color: var(--accent-watt); opacity: 0.8; margin-top: 5px; display: block; letter-spacing: 2px; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .stat-card {
            background: rgba(15, 52, 96, 0.4);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .stat-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 2px; font-weight: 600; }
        .stat-val { font-size: 1.8rem; font-weight: 700; line-height: 1.1; }
        .stat-unit { font-size: 0.8rem; color: var(--text-dim); font-weight: 600; }

        .btn-main {
            background: var(--accent-secondary); color: #000; border: none; padding: 15px; border-radius: 50px;
            font-weight: 800; font-size: 1rem; cursor: pointer; width: 100%; text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(76, 201, 240, 0.3); transition: transform 0.2s; margin-top: auto;
        }
        .btn-main:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-stop { background: var(--accent-primary); color: #fff; box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4); display: none; }

        .progress-container { width: 100%; background: #0f182b; height: 6px; border-radius: 3px; margin-top: 15px; display: none; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent-speed); width: 0%; transition: width 0.3s ease-out; }
        .status-text { font-size: 0.8rem; color: var(--text-dim); text-align: center; margin-top: 8px; min-height: 1.2em; }

        /* --- HÖGER PANEL --- */
        .analysis-panel {
            background: var(--panel-bg);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .analysis-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .analysis-title { font-size: 1.2rem; font-weight: bold; color: #fff; }
        select { background: var(--bg-color); color: white; border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; outline: none; cursor: pointer; }

        .chart-container {
            flex: 1; min-height: 350px;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            border: 1px solid var(--border-color);
            padding: 15px;
            position: relative;
        }
        svg { width: 100%; height: 100%; }
        polyline { fill: none; stroke-width: 2.5; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }

        .totals-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .total-item { flex: 1; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); text-align: center; min-width: 100px; }
        .total-val { font-size: 1.2rem; font-weight: bold; display: block; margin-top: 4px; }
        .total-lbl { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; }

        .history-list {
            max-height: 150px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 10px; background: rgba(0,0,0,0.1);
        }
        .session-item {
            display: flex; justify-content: space-between; padding: 10px 15px;
            border-bottom: 1px solid var(--border-color); font-size: 0.85rem; cursor: pointer; transition: background 0.2s;
        }
        .session-item:hover { background: rgba(255,255,255,0.05); }
        .session-item:last-child { border-bottom: none; }

        .file-controls { display: flex; gap: 10px; margin-top: 5px; }
        .btn-sec { flex: 1; padding: 10px; background: transparent; border: 1px solid var(--border-color); color: var(--text-dim); border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.8rem; }
        .btn-sec:hover { background: var(--border-color); color: #fff; }

        .c-watt { color: var(--accent-watt); }
        .c-speed { color: var(--accent-speed); }
        .c-dist { color: var(--accent-secondary); }
        .c-cal { color: var(--accent-cal); }
        .c-rpm { color: var(--accent-cadence); }

    </style>
</head>
<body>

<div class="main-container">
    
    <!-- VÄNSTER: DASHBOARD -->
    <div class="control-panel scrollable-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="letter-spacing:1px; color:var(--text-dim);">GYMSTICK PRO</strong>
            <span id="connStatus" style="font-size:0.75rem; padding: 4px 8px; background: rgba(0,255,0,0.1); border-radius: 4px; color: var(--accent-speed); display:none;">ANSLUTEN</span>
        </div>

        <div class="header-grid">
            <div class="header-item">
                <h3>Tid</h3>
                <div class="val-time" id="valTime">00:00</div>
            </div>
            <div class="header-item">
                <h3>Motstånd</h3>
                <div class="res-wrapper">
                    <button class="btn-res" id="btnResDown">-</button>
                    <div class="val-res" id="valRes">--</div>
                    <button class="btn-res" id="btnResUp">+</button>
                </div>
            </div>
            <div class="header-item">
                <h3>Puls</h3>
                <div class="val-hr" id="valHr">--</div>
            </div>
        </div>

        <div class="watt-display">
            <div class="watt-val" id="valWatt">0</div>
            <span class="watt-unit">WATT</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Hastighet</div>
                <div class="stat-val c-speed" id="valSpeed">0.0</div>
                <span class="stat-unit">km/h</span>
            </div>
            <div class="stat-card">
                <div class="stat-label">RPM</div>
                <div class="stat-val c-rpm" id="valRpm">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Distans</div>
                <div class="stat-val c-dist" id="valDist">0.00</div>
                <span class="stat-unit">km</span>
            </div>
            <div class="stat-card">
                <div class="stat-label">Kalorier</div>
                <div class="stat-val c-cal" id="valCal">0</div>
                <span class="stat-unit">kcal</span>
            </div>
        </div>

        <div style="margin-top:auto">
            <div class="progress-container" id="progContainer">
                <div class="progress-bar" id="progBar"></div>
            </div>
            <div class="status-text" id="statusText"></div>

            <button class="btn-main" id="connectBtn">ANSLUT CYKEL</button>
            <button class="btn-main btn-stop" id="stopBtn">AVSLUTA & SPARA</button>
        </div>
    </div>

    <!-- HÖGER: GRAFER & HISTORIK -->
    <div class="analysis-panel scrollable-panel">
        <div class="analysis-header">
            <span class="analysis-title">Analys & Data</span>
            <select id="graphRes">
                <option value="10">Upplösning: 10s</option>
                <option value="30">Upplösning: 30s</option>
                <option value="60" selected>Upplösning: 1 min</option>
                <option value="300">Upplösning: 5 min</option>
            </select>
        </div>

        <div class="totals-row">
            <div class="total-item">
                <span class="total-lbl">Total Sträcka</span>
                <span class="total-val c-dist" id="lifeDist">0.0 km</span>
            </div>
            <div class="total-item">
                <span class="total-lbl">Antal Pass</span>
                <span class="total-val" id="sessCount">0</span>
            </div>
            <div class="total-item">
                <span class="total-lbl">Snitt Watt (Nu)</span>
                <span class="total-val c-watt" id="avgWatt">0 W</span>
            </div>
        </div>

        <div class="chart-container">
            <div style="position:absolute; top:10px; left:15px; font-size:11px; color:rgba(255,255,255,0.5); font-weight:600;">
                <span style="color:var(--accent-watt)">― Watt</span> &nbsp;&nbsp; 
                <span style="color:var(--accent-speed)">-- Hastighet</span>
            </div>
            <svg id="chartSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        </div>

        <div class="history-list" id="sessionList"></div>

        <div class="file-controls">
            <button class="btn-sec" id="exportBtn">Exportera JSON</button>
            <button class="btn-sec" onclick="document.getElementById('importFile').click()">Importera JSON</button>
            <input type="file" id="importFile" style="display:none" accept=".json">
            <button class="btn-sec" onclick="resetHistory()" style="color:#ff5555; border-color:#ff5555; flex:0 0 auto;">X</button>
        </div>
    </div>

</div>

<script>
    const ui = {
        connectBtn: document.getElementById('connectBtn'),
        stopBtn: document.getElementById('stopBtn'),
        connLabel: document.getElementById('connStatus'),
        loadBar: document.getElementById('progBar'),
        loadCont: document.getElementById('progContainer'),
        statusText: document.getElementById('statusText'),
        speed: document.getElementById('valSpeed'),
        watt: document.getElementById('valWatt'),
        rpm: document.getElementById('valRpm'),
        dist: document.getElementById('valDist'),
        cal: document.getElementById('valCal'),
        time: document.getElementById('valTime'),
        hr: document.getElementById('valHr'),
        res: document.getElementById('valRes'),
        btnResUp: document.getElementById('btnResUp'),
        btnResDown: document.getElementById('btnResDown'),
        chart: document.getElementById('chartSvg'),
        graphRes: document.getElementById('graphRes'),
        lifeDist: document.getElementById('lifeDist'),
        sessCount: document.getElementById('sessCount'),
        avgWatt: document.getElementById('avgWatt'),
        sessionList: document.getElementById('sessionList')
    };

    let iconsoleWrite = null;
    let pollInterval = null;
    let currentResistance = 1;
    let sessionData = [];
    let startTime = null;
    
    // Synkroniseringsvariabler
    let calculatedDistance = 0; // Vår lokala uträkning
    let lastRawDistance = -1;   // Senast kända "ankare" från cykeln
    let lastPktTime = 0;

    const SEQ = [
        { name: "Ping",   bytes: [0xF0, 0xA0, 0x01, 0x01, 0x92], expect: 0xB0 },
        { name: "Mode",   bytes: [0xF0, 0xA3, 0x01, 0x01, 0x01, 0x96], expect: 0xB3 },
        { name: "Config", bytes: [0xF0, 0xA4, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0xA0], expect: 0xB4 },
        { name: "Start",  bytes: [0xF0, 0xA5, 0x01, 0x01, 0x02, 0x99], expect: 0xB5 }
    ];
    let seqIndex = 0;
    const READ_CMD = [0xF0, 0xA2, 0x01, 0x01, 0x94];
    const STOP_CMD = [0xF0, 0xA5, 0x01, 0x01, 0x04, 0x9B];

    let history = JSON.parse(localStorage.getItem('gymstick_v2_history')) || { sessions: [], totalDist: 0 };
    updateHistoryUI();

    ui.connectBtn.onclick = async () => {
        try {
            ui.statusText.textContent = "Söker enhet...";
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['fitness_machine'] }],
                optionalServices: ['0000fff0-0000-1000-8000-00805f9b34fb']
            });

            device.addEventListener('gattserverdisconnected', onDisconnect);
            ui.statusText.textContent = "Ansluter...";
            
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
            
            const notifyChar = await service.getCharacteristic('0000fff1-0000-1000-8000-00805f9b34fb');
            await notifyChar.startNotifications();
            notifyChar.addEventListener('characteristicvaluechanged', handleData);
            
            iconsoleWrite = await service.getCharacteristic('0000fff2-0000-1000-8000-00805f9b34fb');
            
            ui.connectBtn.style.display = 'none';
            ui.loadCont.style.display = 'block';
            startHandshake();

        } catch (e) {
            ui.statusText.textContent = "Fel: " + e.message;
        }
    };

    function onDisconnect() {
        ui.connLabel.style.display = 'none';
        ui.connectBtn.style.display = 'block';
        ui.stopBtn.style.display = 'none';
        ui.loadCont.style.display = 'none';
        ui.statusText.textContent = "Frånkopplad";
        if(pollInterval) clearInterval(pollInterval);
    }

    function startHandshake() {
        seqIndex = 0;
        sendNext();
    }

    async function sendNext() {
        if (seqIndex >= SEQ.length) {
            ui.statusText.textContent = "";
            ui.loadCont.style.display = 'none';
            ui.connLabel.style.display = 'block';
            ui.stopBtn.style.display = 'block';
            
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => send(READ_CMD), 1000);
            
            // RESET SESSION
            sessionData = [];
            startTime = Date.now();
            calculatedDistance = 0;
            lastRawDistance = -1;
            lastPktTime = Date.now();
            return;
        }
        const step = SEQ[seqIndex];
        ui.loadBar.style.width = ((seqIndex / SEQ.length) * 100) + "%";
        ui.statusText.textContent = "Initierar: " + step.name;
        await send(step.bytes);
    }

    async function send(bytes) {
        if(!iconsoleWrite) return;
        try { await iconsoleWrite.writeValue(new Uint8Array(bytes)); }
        catch(e) { console.log("TX error", e); }
    }

    async function setResistance(lvl) {
        if(lvl < 1) lvl = 1; if(lvl > 32) lvl = 32;
        const byteLvl = lvl + 1;
        const bytes = [0xF0, 0xA6, 0x01, 0x01, byteLvl];
        let sum = 0; for(let b of bytes) sum += b;
        bytes.push(sum & 0xFF);
        await send(bytes);
        currentResistance = lvl;
    }
    ui.btnResUp.onclick = () => setResistance(currentResistance + 1);
    ui.btnResDown.onclick = () => setResistance(currentResistance - 1);

    function handleData(event) {
        const data = new Uint8Array(event.target.value.buffer);

        if (seqIndex < SEQ.length) {
            if (data[0] === 0xF0 && data[1] === SEQ[seqIndex].expect) {
                seqIndex++;
                setTimeout(sendNext, 250);
                return;
            }
        }

        if (data.length >= 20 && data[0] === 0xF0 && data[1] === 0xB2) {
            const val = (h, l) => 100 * (data[h] - 1) + (data[l] - 1);

            const speed = val(6, 7) / 10;
            const rpm = val(8, 9);
            // RAW DIST: 100 meters resolution (e.g. 5 means 0.5km)
            const rawDistKm = val(10, 11) / 10; 
            
            const cal = val(12, 13);
            const hr = val(14, 15);
            const watt = val(16, 17) / 10;
            const level = data[18] - 1; 
            currentResistance = level;

            let tMin = data[4] - 1; if(tMin<0) tMin=0;
            let tSec = data[5] - 1; if(tSec<0) tSec=0;

            // --- SMART DISTANS KALIBRERING ---
            const now = Date.now();
            const timeDelta = (now - lastPktTime) / 1000;
            lastPktTime = now;

            // 1. Har vi fått ett nytt "Ankare"? (t.ex. slagit om från 0.4 till 0.5)
            if (rawDistKm > lastRawDistance && lastRawDistance !== -1) {
                // HÅRD SYNK: Vi vet exakt att vi just passerade gränsen
                calculatedDistance = rawDistKm;
            } else {
                // 2. Dead Reckoning: Addera uträknad sträcka
                if (speed > 0 && timeDelta > 0 && timeDelta < 5) {
                    const distInc = (speed / 3600) * timeDelta;
                    calculatedDistance += distInc;
                }
                // 3. Drift Protection (Taket)
                // Om vi räknat upp till 0.599 men cykeln fortfarande säger 0.5,
                // då får vi inte gå över 0.599 (dvs nästa raw steg)
                if (calculatedDistance > (rawDistKm + 0.099)) {
                    calculatedDistance = rawDistKm + 0.099;
                }
                // Botten: Får aldrig vara mindre än vad cykeln säger
                if (calculatedDistance < rawDistKm) {
                    calculatedDistance = rawDistKm;
                }
            }
            lastRawDistance = rawDistKm;

            ui.speed.textContent = speed.toFixed(1);
            ui.watt.textContent = watt.toFixed(0);
            ui.rpm.textContent = rpm;
            ui.hr.textContent = hr;
            ui.cal.textContent = cal;
            ui.res.textContent = level;
            ui.time.textContent = `${tMin}:${tSec.toString().padStart(2,'0')}`;
            
            // Visa vår smarta distans
            ui.dist.textContent = calculatedDistance.toFixed(3);

            if(startTime) {
                const elapsed = (Date.now() - startTime) / 1000;
                sessionData.push({ t: elapsed, w: watt, s: speed, h: hr });
                if(sessionData.length % 5 === 0) updateChart(sessionData);
                const avg = sessionData.reduce((a,b)=>a+b.w,0) / sessionData.length;
                ui.avgWatt.textContent = Math.round(avg) + " W";
            }
        }
    }

    function updateChart(dataPoints) {
        if(!dataPoints || dataPoints.length < 2) return;
        const res = parseInt(ui.graphRes.value);
        const buckets = [];
        dataPoints.forEach(p => {
            const idx = Math.floor(p.t / res);
            if(!buckets[idx]) buckets[idx] = {c:0, w:0, s:0, t:idx*res};
            buckets[idx].c++; buckets[idx].w += p.w; buckets[idx].s += p.s;
        });
        const valid = buckets.filter(b=>b);
        if(valid.length < 2) return;

        const maxW = Math.max(...valid.map(b=>b.w/b.c)) || 100;
        const maxS = Math.max(...valid.map(b=>b.s/b.c)) || 40;

        let pW="", pS="";
        valid.forEach((b, i) => {
            const x = (i / (valid.length-1)) * 100;
            pW += `${x},${100 - ((b.w/b.c)/ (maxW*1.2) * 100)} `;
            pS += `${x},${100 - ((b.s/b.c)/ (maxS*1.2) * 100)} `;
        });

        ui.chart.innerHTML = `
            <polyline points="${pW}" stroke="#f72585" />
            <polyline points="${pS}" stroke="#23d5ab" stroke-dasharray="4" opacity="0.6" />
        `;
    }
    
    ui.graphRes.onchange = () => updateChart(sessionData);

    ui.stopBtn.onclick = async () => {
        if(confirm("Avsluta pass och spara?")) {
            await send(STOP_CMD);
            history.sessions.push({
                date: new Date().toISOString(),
                dist: parseFloat(ui.dist.textContent),
                data: sessionData
            });
            history.totalDist += parseFloat(ui.dist.textContent);
            saveHistory();
            onDisconnect();
        }
    };

    function updateHistoryUI() {
        ui.lifeDist.textContent = history.totalDist.toFixed(1) + " km";
        ui.sessCount.textContent = history.sessions.length;
        ui.sessionList.innerHTML = history.sessions.slice().reverse().map((s, i) => {
            const date = new Date(s.date).toLocaleString().slice(0,16);
            return `<div class="session-item" onclick="loadOldSession(${history.sessions.length - 1 - i})">
                <span>${date}</span> <span>${s.dist.toFixed(2)} km</span>
            </div>`;
        }).join('');
    }

    window.loadOldSession = (idx) => {
        const sess = history.sessions[idx];
        updateChart(sess.data);
    };

    function saveHistory() {
        localStorage.setItem('gymstick_v2_history', JSON.stringify(history));
        updateHistoryUI();
    }

    window.resetHistory = () => {
        if(confirm("Radera all historik?")) {
            localStorage.clear();
            history = { sessions: [], totalDist: 0 };
            updateHistoryUI();
            location.reload();
        }
    };

    document.getElementById('exportBtn').onclick = () => {
        const blob = new Blob([JSON.stringify(history)], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "gymstick_data.json";
        a.click();
    };

    document.getElementById('importFile').onchange = (e) => {
        const r = new FileReader();
        r.onload = (evt) => {
            try {
                history = JSON.parse(evt.target.result);
                saveHistory();
                if(history.sessions.length > 0) {
                    const last = history.sessions[history.sessions.length-1];
                    updateChart(last.data);
                }
                alert("Data importerad!");
            } catch(err) { alert("Felaktig fil."); }
        };
        r.readAsText(e.target.files[0]);
    };
