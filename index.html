<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymstick Diagnosverktyg</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1a1a1a;
            --text-main: #00ff00;
            --border-color: #333;
        }

        body { 
            font-family: 'Courier New', monospace; 
            background: var(--bg-color); 
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard { 
            background: var(--card-bg); 
            border: 1px solid var(--text-main);
            padding: 20px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .header-row { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px;}
        .big-val { font-size: 2rem; font-weight: bold; }
        .label { font-size: 0.8rem; opacity: 0.7; }

        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .stat-box { text-align: center; border: 1px solid var(--border-color); padding: 10px; }

        button { 
            background: #004400; 
            color: #00ff00; 
            border: 1px solid #00ff00; 
            padding: 15px; 
            width: 100%; 
            font-family: inherit; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
        }
        button:hover { background: #006600; }
        button:disabled { border-color: #555; color: #555; background: #111; cursor: not-allowed; }

        /* LOGG FÖNSTER */
        .log-window {
            width: 100%;
            max-width: 600px;
            height: 300px;
            background: #111;
            border: 1px solid #555;
            overflow-y: scroll;
            font-size: 10px;
            padding: 10px;
            white-space: pre-wrap;
            margin-top: 20px;
        }

        .action-row { display: flex; gap: 10px; width: 100%; max-width: 600px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header-row">
        <div>
            <div class="label">STATUS</div>
            <div id="status">Väntar...</div>
        </div>
        <div style="text-align:right">
            <div class="label">WATT</div>
            <div class="big-val" id="power">0</div>
        </div>
    </div>

    <div class="grid-stats">
        <div class="stat-box">
            <div class="label">HASTIGHET</div>
            <div class="big-val"><span id="speed">0.0</span> <span style="font-size:1rem">km/h</span></div>
        </div>
        <div class="stat-box">
            <div class="label">KADENS</div>
            <div class="big-val"><span id="cadence">0</span> <span style="font-size:1rem">rpm</span></div>
        </div>
    </div>

    <button id="connectBtn">ANSLUT CYKEL & LOGGA</button>
</div>

<div class="action-row">
    <button id="dlLogBtn">SPARA LOGG-FIL (För felsökning)</button>
    <button id="resetBtn" style="background:#330000; border-color:red; color:red">NOLLSTÄLL</button>
</div>

<div class="log-window" id="logOutput">Klicka på Anslut för att starta loggning...</div>

<script>
    const connectBtn = document.getElementById('connectBtn');
    const dlLogBtn = document.getElementById('dlLogBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusEl = document.getElementById('status');
    const logOut = document.getElementById('logOutput');
    const ui = {
        speed: document.getElementById('speed'),
        cadence: document.getElementById('cadence'),
        power: document.getElementById('power')
    };

    let deviceCache = null;
    let fullLog = []; // Sparar all text för nedladdning

    function log(msg) {
        const time = new Date().toLocaleTimeString();
        const line = `[${time}] ${msg}`;
        fullLog.push(line);
        logOut.textContent = line + "\n" + logOut.textContent.slice(0, 5000);
        console.log(line);
    }

    resetBtn.addEventListener('click', () => {
        location.reload();
    });

    dlLogBtn.addEventListener('click', () => {
        const blob = new Blob([fullLog.join('\n')], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "gymstick_debug_log.txt";
        a.click();
    });

    connectBtn.addEventListener('click', async () => {
        try {
            statusEl.textContent = "Söker...";
            log("--- STARTAR SÖKNING ---");
            
            // Vi söker brett för att se ALLT cykeln erbjuder
            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: false,
                filters: [{ services: ['fitness_machine'] }],
                optionalServices: [
                    'fitness_machine', 
                    'cycling_power', 
                    'cycling_speed_and_cadence',
                    'heart_rate',
                    'device_information' // Bra för att se exakt modell
                ]
            });

            deviceCache = device;
            device.addEventListener('gattserverdisconnected', () => {
                log("!!! FRÅNKOPPLAD !!!");
                statusEl.textContent = "Frånkopplad";
                connectBtn.disabled = false;
            });

            log(`Vald enhet: ${device.name} (ID: ${device.id})`);
            statusEl.textContent = "Ansluter GATT...";
            
            const server = await device.gatt.connect();
            log("GATT Ansluten!");

            /* --- STEG 1: Leta efter Tjänster --- */
            // Vi försöker hitta Fitness Machine Service (0x1826)
            try {
                const service = await server.getPrimaryService('fitness_machine');
                log("Hittade Service: Fitness Machine (0x1826)");

                // Försök hitta Indoor Bike Data (0x2AD2)
                const char = await service.getCharacteristic('00002ad2-0000-1000-8000-00805f9b34fb');
                log("Hittade Karakteristik: Indoor Bike Data (0x2AD2)");
                
                await char.startNotifications();
                log("Notifikationer startade på 0x2AD2");
                char.addEventListener('characteristicvaluechanged', (e) => handleData(e, 'FTMS'));

                // Försök starta (Control Point)
                startSession(service);

            } catch (e) {
                log("FEL: Kunde inte hitta Fitness Machine Service: " + e);
            }

            /* --- STEG 2: Leta efter Alternativa Tjänster (Om FTMS är trasig) --- */
            try {
                const powerService = await server.getPrimaryService('cycling_power');
                log("Hittade Service: Cycling Power (0x1818)");
                const powerChar = await powerService.getCharacteristic('cycling_power_measurement');
                await powerChar.startNotifications();
                powerChar.addEventListener('characteristicvaluechanged', (e) => handleData(e, 'PWR'));
                log("Lyssnar på Power Measurement");
            } catch (e) { log("Ingen Cycling Power Service (detta är normalt)."); }

            statusEl.textContent = "Ansluten & Lyssnar";
            connectBtn.disabled = true;

        } catch (err) {
            log("CRITICAL ERROR: " + err);
            statusEl.textContent = "Fel!";
        }
    });

    async function startSession(service) {
        try {
            // Fitness Machine Control Point (0x2AD9)
            const cp = await service.getCharacteristic('00002ad9-0000-1000-8000-00805f9b34fb');
            await cp.startNotifications(); // Måste lyssna på svar
            log("Control Point (0x2AD9) hittad.");
            
            // Försök: Request Control (0x00)
            log("Skickar: Request Control (0x00)");
            await cp.writeValue(new Uint8Array([0x00]));
            
            setTimeout(async () => {
                log("Skickar: Start (0x07)");
                await cp.writeValue(new Uint8Array([0x07]));
            }, 1000);

        } catch (e) {
            log("Kunde inte skriva till Control Point (Kanske read-only?): " + e);
        }
    }

    function handleData(event, type) {
        const value = event.target.value;
        const raw = new Uint8Array(value.buffer);
        
        // SKAPA HEX-STRÄNG
        let hex = [];
        for(let b of raw) hex.push(b.toString(16).padStart(2,'0').toUpperCase());
        const hexStr = hex.join(" ");
        
        log(`DATA [${type}]: ${hexStr}`);

        // Enkel parsing för att se om något rör sig
        if (type === 'FTMS') {
            // Byte 0-1: Flags
            // Byte 2-3: Speed (vanligtvis)
            if (raw.length > 3) {
                const speedRaw = new DataView(value.buffer).getUint16(2, true);
                ui.speed.textContent = (speedRaw / 100).toFixed(1);
            }
            // Byte 6-7: Watt (om Flags stämmer)
            // Detta är en gissning, vi får se i loggen exakt var det hamnar
        }
    }

</script>

</body>
</html>
